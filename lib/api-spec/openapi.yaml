components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── DASHBOARD ─────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required:
        - totaal_gebouwen
        - totaal_voorzieningen
        - goedgekeurde_voorzieningen
        - afgekeurde_voorzieningen
        - openstaande_inspecties
        - openstaande_onderhoud
        - vervallen_inspecties
        - voorzieningen_per_type
      properties:
        totaal_gebouwen:
          type: integer
        totaal_voorzieningen:
          type: integer
        goedgekeurde_voorzieningen:
          type: integer
        afgekeurde_voorzieningen:
          type: integer
        openstaande_inspecties:
          type: integer
        openstaande_onderhoud:
          type: integer
        vervallen_inspecties:
          type: integer
        voorzieningen_per_type:
          type: array
          items:
            type: object
            required: [type, aantal]
            properties:
              type:
                type: string
              aantal:
                type: integer

    Activiteit:
      type: object
      required: [id, type, omschrijving, tijdstip]
      properties:
        id:
          type: integer
        type:
          type: string
        omschrijving:
          type: string
        tijdstip:
          type: string
        gebouw_naam:
          type: ["string", "null"]
        voorziening_nummer:
          type: ["string", "null"]
        gebruiker_naam:
          type: ["string", "null"]

    StatusVerdeling:
      type: object
      required: [gebouw_id, gebouw_naam, totaal, goedgekeurd, afgekeurd, in_bewerking, in_onderhoud]
      properties:
        gebouw_id:
          type: integer
        gebouw_naam:
          type: string
        totaal:
          type: integer
        goedgekeurd:
          type: integer
        afgekeurd:
          type: integer
        in_bewerking:
          type: integer
        in_onderhoud:
          type: integer

    Vervaldag:
      type: object
      required: [id, voorziening_id, voorziening_nummer, gebouw_naam, vervaldatum, type]
      properties:
        id:
          type: integer
        voorziening_id:
          type: integer
        voorziening_nummer:
          type: string
        gebouw_naam:
          type: string
        vervaldatum:
          type: string
        type:
          type: string
        dagen_over:
          type: integer

    # ── GEBOUW ───────────────────────────────────────────────────────────
    Gebouw:
      type: object
      required: [id, naam, adres, aangemaakt_op]
      properties:
        id:
          type: integer
        werknummer:
          type: ["string", "null"]
        naam:
          type: string
        adres:
          type: string
        stad:
          type: ["string", "null"]
        postcode:
          type: ["string", "null"]
        omschrijving:
          type: ["string", "null"]
        klant_id:
          type: ["integer", "null"]
        klant_naam:
