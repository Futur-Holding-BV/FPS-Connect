openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: FPS Brandpreventie - Platform voor brandpreventieve gebouwvoorzieningen
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gebouwen
    description: Gebouw- en verdiepingsbeheer
  - name: voorzieningen
    description: Brandpreventieve voorzieningen (assets)
  - name: inspecties
    description: Inspecties en opleverrapporten
  - name: onderhoud
    description: Onderhoud en herstelacties
  - name: gebruikers
    description: Gebruikers en rollen
  - name: abonnementen
    description: Abonnementsbeheer
  - name: dashboard
    description: Dashboard statistieken
  - name: crm
    description: CRM - klanten, contactpersonen, opdrachten en commercieel
  - name: emails
    description: E-mailarchief per gebouw
  - name: personeel
    description: HRM - medewerkers, functiehuis, opleidingen, bekwaamheden en verlof
  - name: dossiers
    description: Project- en gebouwdossiers met documentstatussen en archivering
  - name: offertes
    description: Offertestructuur, begroting en uitgangspunten (Offerte Intelligence)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── DASHBOARD ────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Platform-brede statistieken
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recente-activiteit:
    get:
      operationId: getRecenteActiviteit
      tags: [dashboard]
      summary: Recente wijzigingen en activiteit
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activiteit"

  /dashboard/status-verdeling:
    get:
      operationId: getStatusVerdeling
      tags: [dashboard]
      summary: Verdeling voorzieningen per status per gebouw
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusVerdeling"

  /dashboard/vervaldagen:
    get:
      operationId: getVervaldagen
      tags: [dashboard]
      summary: Aankomende inspectievervaldata
      parameters:
        - in: query
          name: dagen
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vervaldag"

  # ── GEBOUWEN ─────────────────────────────────────────────────────────────
  /gebouwen:
    get:
      operationId: listGebouwen
      tags: [gebouwen]
      summary: Lijst van gebouwen
      parameters:
        - in: query
          name: zoek
          schema:
            type: string
        - in: query
          name: organisatie_id
          schema:
            type: integer
        - in: query
          name: mijn
          schema:
            type: boolean
          description: >
            Indien true: retourneer alleen gebouwen die aan de ingelogde gebruiker zijn toegewezen.
            Gebruikers met gebouwbeheer (bevoegdheidsniveau 2 of hoger) en de hoofdbeheerder zien altijd alle gebouwen.
            Voor gebruikers die tot hun toegewezen gebouwen beperkt zijn, wordt dit automatisch geforceerd.
        - in: query
          name: partij_type
          schema:
            type: string
          description: >
            Filter op partijtype (eigenaar, gebruiker, opdrachtgever, aanvrager).
            Retourneer alleen gebouwen met minstens één partij van dit type.
        - in: query
          name: partij_naam
          schema:
            type: string
          description: >
            Filter op de naam van een partij. In combinatie met partij_type wordt
            alleen op partijen van dat type gematcht.
        - in: query
          name: inclusief_gearchiveerd
          schema:
            type: boolean
          description: >
            Indien true: inclusief gearchiveerde gebouwen. Standaard worden
            gearchiveerde gebouwen niet getoond.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Gebouw"
    post:
      operationId: createGebouw
      tags: [gebouwen]
      summary: Nieuw gebouw aanmaken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GebouwInput"
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gebouw"

  /gebouwen/ai-analyse:
    post:
      operationId: aiAnalyseGebouw
      tags: [gebouwen]
      summary: AI-analyse van een vrije beschrijving (extractie + geocoding + satellietbeeld) voor gebouwgegevens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GebouwAiAnalyseInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GebouwAiAnalyseResultaat"

  /gebouwen/{id}/tekeningen/ai-analyse:
    post:
      operationId: aiAnalyseTekening
      tags: [gebouwen]
      summary: AI-voorstel voor bouwlaag (naam + niveau) en tekeningnaam o.b.v. de bestandsnaam
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TekeningAiAnalyseInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TekeningAiAnalyseResultaat"

  /gebouwen/{id}/plattegrond/ai-analyse:
    post:
      operationId: aiAnalysePlattegrond
      tags: [gebouwen]
      summary: AI-voorstel voor bouwlaag o.b.v. de inhoud van de plattegrond (vision)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlattegrondAiAnalyseInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlattegrondAiAnalyseResultaat"

  /gebouwen/{id}/volgend-spotnummer:
    get:
      operationId: getVolgendSpotnummer
      tags: [gebouwen]
      summary: Volgend automatisch spotnummer voor een gebouw ophalen
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolgendSpotnummer"
        "404":
          description: Niet gevonden

  /gebouwen/{id}/kaart:
    get:
      operationId: getGebouwKaart
      tags: [gebouwen]
      summary: Google Maps kaart-embed URL voor een gebouw
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KaartEmbed"
        "404":
          description: Geen locatiegegevens beschikbaar
        "503":
          description: Kaartservice niet beschikbaar

  /gebouwen/{id}/gevelbeeld:
    get:
      operationId: getGebouwGevelbeeld
      tags: [gebouwen]
      summary: Street View gevelafbeelding (base64 data-URL) voor het voorblad
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [beeld]
                properties:
                  beeld:
                    type: ["string", "null"]

  /gebouwen/{id}:
    get:
      operationId: getGebouw
      tags: [gebouwen]
      summary: Gebouwdetails ophalen
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GebouwDetail"
        "404":
          description: Niet gevonden
    patch:
      operationId: updateGebouw
      tags: [gebouwen]
      summary: Gebouw bijwerken
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GebouwUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gebouw"
    delete:
      operationId: deleteGebouw
      tags: [gebouwen]
      summary: Gebouw verwijderen
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Verwijderd

  /gebouwen/{id}/gereed:
    patch:
      operationId: meldGebouwGereed
      tags: [gebouwen]
      summary: Gebouw gereedmelden
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GebouwGereedInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gebouw"
        "404":
          description: Niet gevonden
    delete:
      operationId: herstelGebouwActief
      tags: [gebouwen]
      summary: Gereed-status terugzetten naar actief
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gebouw"
        "404":
          description: Niet gevonden

  /gebouwen/{id}/opleverrapport:
    post:
      operationId: bewaarOpleverrapport
      tags: [gebouwen]
      summary: Opleverrapport-PDF als document opslaan en aan het gebouw koppelen
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpleverrapportNaarDmsInput"
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Ongeldige invoer
        "403":
          description: Geen toegang
        "404":
          description: Niet gevonden

  /gebouwen/{id}/archief:
    patch:
      operationId: archiveerGebouw
      tags: [gebouwen]
      summary: Gebouw archiveren of terugplaatsen
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiefUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GebouwDetail"
        "403":
          description: Geen toegang
        "404":
          description: Niet gevonden

  /gebouwen/{id}/verdiepingen:
    get:
      operationId: listVerdiepingen
      tags: [gebouwen]
      summary: Verdiepingen van een gebouw
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Verdieping"
    post:
      operationId: createVerdieping
      tags: [gebouwen]
      summary: Verdieping toevoegen
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerdiepingInput"
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verdieping"

  /verdiepingen/{id}:
    get:
      operationId: getVerdieping
      tags: [gebouwen]
      summary: Verdieping ophalen
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verdieping"
    patch:
      operationId: updateVerdieping
      tags: [gebouwen]
      summary: Verdieping bijwerken
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerdiepingUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verdieping"
    delete:
      operationId: deleteVerdieping
      tags: [gebouwen]
      summary: Verdieping verwijderen
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Verwijderd

  # ── GEBOUW TOEWIJZINGEN ───────────────────────────────────────────────────
  /gebouwen/{id}/toewijzingen:
    get:
      operationId: listGebouwToewijzingen
      tags: [gebouwen]
      summary: Toewijzingen van een gebouw ophalen
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Toewijzing"
        "403":
          description: Geen toegang
    post:
      operationId: createGebouwToewijzing
      tags: [gebouwen]
      summary: Gebouw toewijzen aan gebruiker (alleen beheerder)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToewijzingInput"
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Toewijzing"
        "400":
          description: Ongeldige invoer
        "403":
          description: Geen toegang

  /gebouwen/{id}/spots-inzicht:
    get:
      operationId: getGebouwSpotsInzicht
      tags: [gebouwen]
      summary: Spots-inzicht van een gebouw (per monteur per dag)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotsInzicht"
        "403":
          description: Geen toegang

  /gebouwen/{id}/toewijzingen/{gebruikerId}:
    delete:
      operationId: deleteGebouwToewijzing
      tags: [gebouwen]
      summary: Toewijzing verwijderen (alleen beheerder)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: gebruikerId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Verwijderd
        "403":
          description: Geen toegang

  /gebouwen/partij-opties:
    get:
      operationId: listGebouwPartijOpties
      tags: [gebouwen]
      summary: Unieke partijen (type + naam) over alle zichtbare gebouwen, voor filteropties
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GebouwPartijOptie"

  /gebouwen/{id}/partijen:
    get:
      operationId: listGebouwPartijen
      tags: [gebouwen]
      summary: Partijen (eigenaar/gebruiker/opdrachtgever/aanvrager) van een gebouw
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GebouwPartij"
        "403":
          description: Geen toegang
    post:
      operationId: createGebouwPartij
      tags: [gebouwen]
      summary: Partij toevoegen aan gebouw (alleen beheerder)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GebouwPartijInput"
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GebouwPartij"
        "400":
          description: Ongeldige invoer
        "403":
          description: Geen toegang

  /gebouwen/partijen/{partijId}:
    patch:
      operationId: updateGebouwPartij
      tags: [gebouwen]
      summary: Partij bijwerken (alleen beheerder)
      parameters:
        - in: path
          name: partijId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GebouwPartijUpdate"
      responses:
        "200":
          description: Bijgewerkt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GebouwPartij"
        "403":
          description: Geen toegang
        "404":
          description: Niet gevonden
    delete:
      operationId: deleteGebouwPartij
      tags: [gebouwen]
      summary: Partij verwijderen (alleen beheerder)
      parameters:
        - in: path
          name: partijId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Verwijderd
        "403":
          description: Geen toegang

  /gebouwen/{id}/tekeningen:
    get:
      operationId: listGebouwTekeningen
      tags: [gebouwen]
      summary: Tekeningen van een gebouw
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tekening"
        "403":
          description: Geen toegang
    post:
      operationId: createGebouwTekening
      tags: [gebouwen]
      summary: Tekening toevoegen aan gebouw (alleen beheerder)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TekeningInput"
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tekening"
        "400":
          description: Ongeldige invoer
        "403":
          description: Geen toegang

  /gebouwen/tekeningen/{tekeningId}:
    patch:
      operationId: updateGebouwTekening
      tags: [gebouwen]
      summary: Tekening bijwerken (alleen beheerder)
      parameters:
        - in: path
          name: tekeningId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TekeningUpdate"
      responses:
        "200":
          description: Bijgewerkt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tekening"
        "403":
          description: Geen toegang
        "404":
          description: Niet gevonden
    delete:
      operationId: deleteGebouwTekening
      tags: [gebouwen]
      summary: Tekening verwijderen (alleen beheerder)
      parameters:
        - in: path
          name: tekeningId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Verwijderd
        "403":
          description: Geen toegang

  # ── BRANDVOORZIENINGEN ────────────────────────────────────────────────────
  /voorzieningen:
    get:
      operationId: listVoorzieningen
      tags: [voorzieningen]
      summary: Lijst van brandpreventieve voorzieningen
      parameters:
        - in: query
          name: gebouw_id
          schema:
            type: integer
        - in: query
          name: verdieping_id
          schema:
            type: integer
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: gearchiveerd
          schema:
            type: boolean
        - in: query
          name: classificatie
          schema:
            type: string
        - in: query
          name: alleen_te_controleren
          schema:
            type: boolean
        - in: query
          name: zoek
          schema:
            type: string
        - in: query
          name: pagina
          schema:
            type: integer
            default: 1
        - in: query
          name: per_pagina
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoorzieningLijst"
    post:
      operationId: createVoorziening
      tags: [voorzieningen]
      summary: Nieuwe voorziening registreren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoorzieningInput"
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voorziening"

  /voorzieningen/{id}:
    get:
      operationId: getVoorziening
      tags: [voorzieningen]
      summary: Voorzieningdetails ophalen
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoorzieningDetail"
        "404":
          description: Niet gevonden
    patch:
      operationId: updateVoorziening
      tags: [voorzieningen]
      summary: Voorziening bijwerken
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
