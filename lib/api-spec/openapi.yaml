          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Goedgekeurd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStudioModel"
        "400":
          description: Geen concept beschikbaar om goed te keuren
        "404":
          description: Niet gevonden

  /studio/modellen/actief:
    get:
      operationId: getActiefDocumentStudioModel
      tags: [studio]
      summary: Actief (goedgekeurd) Document Studio model ophalen voor een werkgever + documenttype
      parameters:
        - in: query
          name: werkgever_id
          required: true
          schema:
            type: integer
        - in: query
          name: document_type
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Actief goedgekeurd model (null als er geen goedgekeurd model bestaat voor dit type)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DocumentStudioModel"
                  - type: "null"
        "400":
          description: werkgever_id of document_type ontbreekt

  /studio/werkgevers/{werkgever_id}/modellen/actief:
    get:
      operationId: listActieveDocumentStudioModellen
      tags: [studio]
      summary: Alle actieve (goedgekeurde) templates voor een werkgever ophalen (bulk)
      parameters:
        - in: path
          name: werkgever_id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Record van documenttype naar actief model
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/DocumentStudioModel"

  /studio/werkgevers:
    get:
      operationId: listStudioWerkgevers
      tags: [studio]
      summary: Werkgevers ophalen voor Document Studio selector (gated op organisatie:lezen)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentStudioWerkgever"

