      required: [familie, koptekst, kleurschema, secties]
      properties:
        familie:
          type: string
          enum: [A, B, C]
        koptekst:
          type: object
          required: [logo_positie, titel]
          properties:
            logo_positie: { type: string, enum: [links, rechts, midden] }
            titel:        { type: string }
            subinfo:      { type: ["string", "null"] }
        kleurschema:
          type: object
          required: [primair, secundair, tekst]
          properties:
            primair:   { type: string }
            secundair: { type: string }
            tekst:     { type: string }
        secties:
          type: array
          items:
            type: object
            required: [type, inhoud]
            properties:
              type:   { type: string, enum: [tekst, tabel, ondertekening, checklist] }
              titel:  { type: ["string", "null"] }
              inhoud: { type: string }
        voettekst: { type: ["string", "null"] }
