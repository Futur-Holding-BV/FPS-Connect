name: Deploy naar productie

# ─── Automatische deploy ─────────────────────────────────────────────────────
# Elke push naar main deployt automatisch naar de productie-VPS; er is bewust
# GEEN handmatige goedkeuringsstap. De server bouwt de images zelf (lokaal build,
# geen registry-images) volgens de bewezen volgorde:
#   git pull  ->  docker compose build  ->  migrate  ->  up -d
# Bij elke fout stopt de deploy onmiddellijk (set -euo pipefail).
#
# ─── Deploybeleid (vastgesteld 10 juli 2026): geen aparte goedkeuring meer ────
# Productie is de actieve acceptatieomgeving; fixes gaan direct naar productie
# zodra de gates groen zijn (zie docs/PRODUCTION_RUNBOOK.md). Het oude proces met
# Required reviewers op het `production`-environment is VERVALLEN. Staan er op
# GitHub -> Settings -> Environments -> production nog Required reviewers, verwijder
# die dan, zodat er geen aparte goedkeuring meer wordt afgedwongen.

on:
  # Automatisch bij elke push naar main
  push:
    branches: [main]

  # Of handmatig starten vanuit de GitHub Actions-tab
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy naar productie
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false    # nooit een lopende deploy annuleren

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            # De productie-stack draait vanuit deze map (lokaal gebouwde images)
            cd /opt/fps-one/deploy

            # Vorige (huidige, nog gezonde) commit onthouden vóór de pull, zodat
            # we hier automatisch naar kunnen terugrollen als de nieuwe release
            # de healthcheck niet haalt.
            VORIGE_COMMIT="$(git rev-parse HEAD)"
            echo "Huidige (mogelijk terug te rollen) commit: $VORIGE_COMMIT"

            # 1. Nieuwste code van de productiebranch ophalen (de server pullt zelf van GitHub)
            git pull --ff-only origin main

            # Alle compose-commando's delen dezelfde env-file en compose-file.
            # --env-file is vereist: docker-compose.production.yml interpoleert
            # ${DATABASE_URL} en ${POSTGRES_PASSWORD} uit .env.production.
            COMPOSE="docker compose --env-file .env.production -f docker-compose.production.yml"

            # Post-deploy healthcheck als functie: bevestigt dat de release ook
            # echt gezond draait. `up -d` slaagt al zodra de containers zijn
            # gestart, maar zegt niets over een halve migratie of een api die
            # niet opstart. We pollen daarom de healthz-route BINNEN de
            # api-container (poort 8080 is intern, niet op de host gepubliceerd)
            # met dezelfde node-check die de container-healthcheck gebruikt,
            # plus de publieke route via caddy. Wordt ook hergebruikt om ná een
            # automatische rollback te bevestigen dat productie weer gezond is.
            healthcheck() {
              echo "Healthcheck gestart..."
              HEALTH_POGINGEN=30   # 30 pogingen x 5s = max ~150s wachttijd
              HEALTH_OK=0
              for i in $(seq 1 "$HEALTH_POGINGEN"); do
                if $COMPOSE exec -T api node -e "require('http').get('http://localhost:8080/api/healthz', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"; then
                  HEALTH_OK=1
                  echo "API gezond (poging $i/$HEALTH_POGINGEN)"
                  break
                fi
                echo "API nog niet gezond (poging $i/$HEALTH_POGINGEN), 5s wachten..."
                sleep 5
              done

              if [ "$HEALTH_OK" -ne 1 ]; then
                echo "FOUT: API werd niet gezond binnen de timeout." >&2
                $COMPOSE ps || true
                echo "--- Laatste api-logs ---" >&2
                $COMPOSE logs --tail=80 api || true
                return 1
              fi

              # Publieke route via caddy controleren (proxy /api/* -> api:8080).
              # -k: caddy serveert een cert voor de productiedomeinnaam, niet voor
              # localhost; we testen hier alleen dat de proxy-keten werkt.
              echo "Publieke healthz via caddy controleren..."
              if ! curl -fsSk --max-time 10 https://localhost/api/healthz >/dev/null; then
                echo "FOUT: healthz niet bereikbaar via caddy." >&2
                $COMPOSE ps || true
                echo "--- Laatste caddy-logs ---" >&2
                $COMPOSE logs --tail=80 caddy || true
                return 1
              fi
              echo "Healthcheck geslaagd: release is gezond."
              return 0
            }

            # 2. Images lokaal op de VPS bouwen (geen registry-images)
            $COMPOSE build

            # 3. Database-migraties draaien vóór de cutover (eenmalige run)
            $COMPOSE run --rm migrate

            # 4. Stack starten/bijwerken (langlopende services)
            $COMPOSE up -d --remove-orphans db api caddy

            # 5. Post-deploy healthcheck van de nieuwe release
            if healthcheck; then
              # 6. Opschonen van oude images (ouder dan 72u) — alleen bij een gezonde release
              docker image prune -f --filter "until=72h"
              echo "Deploy voltooid"
              exit 0
            fi

            # ─── Automatische rollback ──────────────────────────────────────
            # De nieuwe release is NIET gezond. In plaats van de kapotte stack
            # te laten draaien, rollen we terug naar de vorige gezonde commit
            # en herstarten we de stack daarmee. LET OP: dit rolt alleen de
            # applicatiecode terug (Niveau 1 uit ROLLBACK_PRODUCTION.md); een
            # rollback met schema-/database-wijzigingen (Niveau 2) blijft
            # handmatig, zie dat document.
            echo "Release is NIET gezond. Automatische rollback naar $VORIGE_COMMIT gestart..." >&2

            if [ "$VORIGE_COMMIT" = "$(git rev-parse HEAD)" ]; then
              echo "WAARSCHUWING: er was geen vorige commit om naar terug te rollen (eerste deploy?)." >&2
            else
              git checkout "$VORIGE_COMMIT" --
              $COMPOSE build
              $COMPOSE up -d --remove-orphans db api caddy
            fi

            echo "Healthcheck na rollback gestart..."
            if healthcheck; then
              echo "Rollback geslaagd: productie draait weer op de vorige gezonde versie ($VORIGE_COMMIT)." >&2
            else
              echo "FOUT: rollback-healthcheck faalt OOK. Handmatige interventie vereist — zie deploy/ROLLBACK_PRODUCTION.md (Niveau 2)." >&2
            fi

            # De run faalt altijd als de oorspronkelijke healthcheck faalde,
            # ook als de rollback zelf slaagde: de deploy an sich is mislukt en
            # dat moet zichtbaar zijn in GitHub Actions.
            exit 1
