name: Deploy naar productie

# ─── Automatische deploy ─────────────────────────────────────────────────────
# Elke push naar main deployt automatisch naar de productie-VPS
# (connect.fps-one.nl); er is bewust GEEN handmatige goedkeuringsstap.
# De feitelijke deploystappen staan in scripts/deploy-production.sh — dat
# script wordt naar de server gekopieerd en daar uitgevoerd, zodat de versie
# uit de zojuist gepushte commit draait en de `git reset --hard` op de server
# het lopende script niet kan overschrijven.
#
# Benodigde GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   PROD_SSH_KEY   — private SSH-sleutel (volledige meerregelige PEM-inhoud)
#   PROD_SSH_HOST  — 149.210.181.47
#   PROD_SSH_USER  — rene
#   PROD_SSH_PORT  — SSH-poort (optioneel; standaard 22)
# Voor de post-deploy smoketest (stap na de containers-up):
#   SMOKETEST_EMAIL    — e-mailadres van het smoketest-account (bijv. René's login)
#   SMOKETEST_PASSWORD — wachtwoord van dat account
# Optioneel voor de faalmelding per e-mail:
#   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
#   MAIL_FROM / MAIL_MAILBOX / RENE_ALERT_EMAIL
#
# ─── Deploybeleid (vastgesteld 10 juli 2026): geen aparte goedkeuring ────────
# Productie is de actieve acceptatieomgeving; fixes gaan direct naar productie
# zodra de gates groen zijn (zie docs/PRODUCTION_RUNBOOK.md).

on:
  # Automatisch bij elke push naar main
  push:
    branches: [main]

  # Of handmatig starten vanuit de GitHub Actions-tab
  workflow_dispatch:
    inputs:
      noodfix:
        description: >-
          Typ NOODFIX om de pre-deploy controles (typecheck, dubbele-routes)
          bewust over te slaan. Alleen gebruiken als productie
          plat ligt en de controles zelf de blokkade zijn.
          Zie docs/PRODUCTION_RUNBOOK.md, sectie "Noodfix: gate bewust passeren".
        required: false
        default: ""

# Nooit twee deployments tegelijk; een lopende deploy wordt nooit geannuleerd,
# een nieuwe push wacht netjes tot de vorige klaar is.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy naar productie
    runs-on: ubuntu-latest

    steps:
      # Checkout is nodig om scripts/deploy-production.sh (en de commit-
      # omschrijving voor de faalmelding) beschikbaar te hebben.
      - uses: actions/checkout@v4

      # ─── Tijdbewaking (DEPLOY_SNELHEID_01 punt 4) ────────────────────────────
      # Starttijd en mijlpalen vastleggen; de bewakingsstap onderaan rekent er
      # de duur per fase mee uit en mailt René als de uitrol > 8 minuten duurt.
      - name: Starttijd vastleggen
        run: |
          echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "start|$(date +%s)" > /tmp/mijlpalen.txt

      # ─── Controles vóór de VPS wordt aangeraakt (MERGE_01 §3.2) ─────────────
      # De Docker-build bundelt met esbuild en controleert geen types; op
      # 8 aug 2026 belandde daardoor code met ongedefinieerde variabelen op
      # productie. Deze stappen draaien dezelfde controles als de CI, maar
      # binnen de deploy zelf: faalt er één, dan wordt er niets uitgerold.
      # Dit is geen goedkeuringspoort — elke push naar main rolt nog steeds
      # automatisch uit zodra de controles slagen.
      #
      # Noodfix-bypass: alleen via handmatige workflow_dispatch met input
      # noodfix=NOODFIX worden deze controles overgeslagen (gedocumenteerd in
      # docs/PRODUCTION_RUNBOOK.md). Een gewone push kan de gate nooit omzeilen.
      - name: Noodfix-bypass melden
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.noodfix == 'NOODFIX'
        run: |
          echo "::warning::NOODFIX-BYPASS ACTIEF — pre-deploy controles worden bewust overgeslagen (handmatige dispatch)."

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installeer dependencies (voor controles)
        run: pnpm install --frozen-lockfile

      - name: Controle 1/3 — typecheck
        if: github.event.inputs.noodfix != 'NOODFIX'
        run: pnpm run typecheck

      - name: Controle 2/3 — dubbele-routes-controle
        if: github.event.inputs.noodfix != 'NOODFIX'
        run: pnpm --filter @workspace/scripts run check-dubbele-routes

      # KLANTLOOS_01 fase 3: faalt zodra de klantrol of een "of klant"-
      # autorisatievariant terugkeert in Connect.
      - name: Controle 3/3 — klantloos-controle
        if: github.event.inputs.noodfix != 'NOODFIX'
        run: pnpm --filter @workspace/scripts run klantloos-check

      - name: SSH-sleutel en hostkey instellen
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          echo "controles-en-install|$(date +%s)" >> /tmp/mijlpalen.txt

          if [ -z "${PROD_SSH_KEY:-}" ] || [ -z "${PROD_SSH_HOST:-}" ]; then
            echo "FOUT: GitHub Secrets PROD_SSH_KEY en/of PROD_SSH_HOST ontbreken." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Sleutel naar bestand schrijven zonder hem ooit te tonen.
          # Ondersteunt zowel multiline-secrets (echte newlines) als platte
          # strings met \n-sequenties (Replit-opslagformaat).
          printf '%s' "${PROD_SSH_KEY}" | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Host key veilig vastleggen: ssh-keyscan haalt de publieke hostkey
          # op en pint die in known_hosts (StrictHostKeyChecking blijft aan).
          ssh-keyscan -p "${PROD_SSH_PORT}" -H "${PROD_SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          if ! grep -q . ~/.ssh/known_hosts; then
            echo "FOUT: ssh-keyscan leverde geen hostkey op voor de server." >&2
            exit 1
          fi

      - name: Deployscript naar de server kopiëren
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_SSH_USER:-}" ]; then
            echo "FOUT: GitHub Secret PROD_SSH_USER ontbreekt." >&2
            exit 1
          fi
          scp -i ~/.ssh/deploy_key -P "${PROD_SSH_PORT}" \
            scripts/deploy-production.sh \
            "${PROD_SSH_USER}@${PROD_SSH_HOST}:/tmp/deploy-production.sh"

      - name: Deploy uitvoeren op de VPS
        id: deploy
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          # De exitcode van het script op de server bepaalt direct het
          # resultaat van deze stap: iedere fout stopt de workflow (pipefail
          # laat de ssh-exitcode door de tee heen). De uitvoer gaat óók naar
          # /tmp/deploy-output.log, zodat de tijd- en schijfbewaking onderaan
          # de TIJD|- en SCHIJF_ALARM|-regels van het script kan lezen.
          ssh -i ~/.ssh/deploy_key -p "${PROD_SSH_PORT}" \
            "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
            'bash /tmp/deploy-production.sh' 2>&1 | tee /tmp/deploy-output.log
          echo "vps-deploy|$(date +%s)" >> /tmp/mijlpalen.txt

      # ─── Smoketest na deploy ─────────────────────────────────────────────────
      # Drie kritieke API-controles uitgevoerd vanaf de Actions runner (extern,
      # dezelfde route als een echte gebruiker). Geeft direct zekerheid dat de
      # release niet heeft inloggen of de kernapplicatie gebroken heeft.
      # Credentials staan als GitHub Actions secrets, nooit als platte tekst.
      - name: Smoketest uitvoeren
        id: smoketest
        env:
          SMOKETEST_EMAIL: ${{ secrets.SMOKETEST_EMAIL }}
          SMOKETEST_PASSWORD: ${{ secrets.SMOKETEST_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${SMOKETEST_EMAIL:-}" ] || [ -z "${SMOKETEST_PASSWORD:-}" ]; then
            echo "WAARSCHUWING: SMOKETEST_EMAIL en/of SMOKETEST_PASSWORD ontbreekt als GitHub Actions secret; smoketest wordt overgeslagen." >&2
            echo "smoketest|$(date +%s)" >> /tmp/mijlpalen.txt
            exit 0
          fi

          BASE_URL="https://connect.fps-one.nl"
          COOKIEJAR=$(mktemp)
          FAIL=0
          GESLAAGD=0
          TOTAAL=0

          # Helper: check-resultaat registreren
          check_ok() { echo "OK: $1"; GESLAAGD=$((GESLAAGD+1)); TOTAAL=$((TOTAAL+1)); }
          check_fout() { echo "FOUT: $1" >&2; FAIL=1; TOTAAL=$((TOTAAL+1)); }

          # ── 1. Healthcheck (publiek, zonder auth) ──────────────────────────
          echo "--- Check 1: GET /api/healthz ---"
          HEALTH=$(curl -fsS --max-time 15 "${BASE_URL}/api/healthz" 2>/dev/null || echo "")
          HEALTH_STATUS=$(echo "$HEALTH" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).status||'')}catch(e){console.log('')}})" 2>/dev/null || echo "")
          if [ "$HEALTH_STATUS" = "ok" ]; then
            check_ok "healthz geeft status=ok"
          else
            check_fout "/api/healthz: verwacht status=ok, ontvangen: ${HEALTH}"
          fi

          # ── 2. Versie-endpoint (publiek) ───────────────────────────────────
          echo "--- Check 2: GET /api/versie ---"
          VERSIE_RESP=$(curl -fsS --max-time 15 "${BASE_URL}/api/versie" 2>/dev/null || echo "")
          VERSIE_COMMIT=$(echo "$VERSIE_RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).commit||'')}catch(e){console.log('')}})" 2>/dev/null || echo "")
          if [ -n "$VERSIE_COMMIT" ]; then
            check_ok "versie-endpoint geeft commit=${VERSIE_COMMIT}"
          else
            check_fout "/api/versie: commit-veld ontbreekt — ontvangen: ${VERSIE_RESP}"
          fi

          # ── 3. Systeemstatus — databaseverbinding (publiek) ────────────────
          echo "--- Check 3: GET /api/versie/status ---"
          STATUS_RESP=$(curl -fsS --max-time 20 "${BASE_URL}/api/versie/status" 2>/dev/null || echo "")
          DB_STATUS=$(echo "$STATUS_RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).db||'')}catch(e){console.log('')}})" 2>/dev/null || echo "")
          if [ "$DB_STATUS" = "ok" ]; then
            check_ok "systeemstatus: databaseverbinding ok"
          else
            check_fout "/api/versie/status: db=${DB_STATUS} (verwacht ok) — ontvangen: ${STATUS_RESP}"
          fi

          # ── 4. Login met smoketest-account ────────────────────────────────
          echo "--- Check 4: POST /api/auth/login ---"
          LOGIN_BODY=$(node -e "console.log(JSON.stringify({email:process.env.SMOKETEST_EMAIL,wachtwoord:process.env.SMOKETEST_PASSWORD}))" 2>/dev/null)
          LOGIN_HTTP=$(curl -sS --max-time 20 -o /tmp/login-resp.json -w "%{http_code}" \
            -c "$COOKIEJAR" \
            -X POST "${BASE_URL}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "$LOGIN_BODY" 2>/dev/null || echo "000")
          if [ "$LOGIN_HTTP" -eq 200 ]; then
            check_ok "login geeft HTTP 200"
          else
            check_fout "POST /api/auth/login: HTTP ${LOGIN_HTTP} (verwacht 200)"
            cat /tmp/login-resp.json >&2 || true
          fi

          # ── 5. Gebruikerslijst (sessie vereist) ──────────────────────────
          echo "--- Check 5: GET /api/gebruikers ---"
          USERS_HTTP=$(curl -sS --max-time 15 -o /tmp/users-resp.json -w "%{http_code}" \
            -b "$COOKIEJAR" "${BASE_URL}/api/gebruikers" 2>/dev/null || echo "000")
          USERS_COUNT=$(node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const a=JSON.parse(d);console.log(Array.isArray(a)?a.length:0)}catch(e){console.log(0)}})" < /tmp/users-resp.json 2>/dev/null || echo "0")
          if [ "$USERS_HTTP" -eq 200 ] && [ "$USERS_COUNT" -gt 0 ]; then
            check_ok "gebruikerslijst: ${USERS_COUNT} gebruikers"
          else
            check_fout "GET /api/gebruikers: HTTP ${USERS_HTTP}, aantal=${USERS_COUNT}"
          fi

          # ── 6. Dashboard statistieken ─────────────────────────────────────
          echo "--- Check 6: GET /api/dashboard/stats ---"
          STATS_HTTP=$(curl -sS --max-time 15 -o /tmp/stats-resp.json -w "%{http_code}" \
            -b "$COOKIEJAR" "${BASE_URL}/api/dashboard/stats" 2>/dev/null || echo "000")
          if [ "$STATS_HTTP" -eq 200 ]; then
            check_ok "dashboard/stats geeft HTTP 200"
          else
            check_fout "GET /api/dashboard/stats: HTTP ${STATS_HTTP}"
          fi

          # ── 7. Recente activiteit ─────────────────────────────────────────
          echo "--- Check 7: GET /api/dashboard/recente-activiteit ---"
          ACTIV_HTTP=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" \
            -b "$COOKIEJAR" "${BASE_URL}/api/dashboard/recente-activiteit" 2>/dev/null || echo "000")
          if [ "$ACTIV_HTTP" -eq 200 ]; then
            check_ok "recente-activiteit geeft HTTP 200"
          else
            check_fout "GET /api/dashboard/recente-activiteit: HTTP ${ACTIV_HTTP}"
          fi

          # ── 8. Gebouwenlijst ──────────────────────────────────────────────
          echo "--- Check 8: GET /api/gebouwen ---"
          GEBOUW_HTTP=$(curl -sS --max-time 15 -o /tmp/gebouwen-resp.json -w "%{http_code}" \
            -b "$COOKIEJAR" "${BASE_URL}/api/gebouwen" 2>/dev/null || echo "000")
          if [ "$GEBOUW_HTTP" -eq 200 ]; then
            check_ok "gebouwenlijst geeft HTTP 200"
          else
            check_fout "GET /api/gebouwen: HTTP ${GEBOUW_HTTP}"
          fi

          # ── 9. Gebouw aanmaken (smoke-testgebouw) ─────────────────────────
          echo "--- Check 9: POST /api/gebouwen (smoke-testgebouw aanmaken) ---"
          TEST_GEBOUW_ID=""
          CREATE_BODY='{"naam":"__smoketest__","adres":"Teststraat 1","huisnummer":"1","postcode":"1234AB","stad":"Teststad","provincie":"Noord-Holland","land":"Nederland","gebouw_type":"overig"}'
          CREATE_HTTP=$(curl -sS --max-time 20 -o /tmp/create-resp.json -w "%{http_code}" \
            -b "$COOKIEJAR" -c "$COOKIEJAR" \
            -X POST "${BASE_URL}/api/gebouwen" \
            -H "Content-Type: application/json" \
            -d "$CREATE_BODY" 2>/dev/null || echo "000")
          if [ "$CREATE_HTTP" -eq 201 ]; then
            TEST_GEBOUW_ID=$(node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).id||'')}catch(e){console.log('')}})" < /tmp/create-resp.json 2>/dev/null || echo "")
            check_ok "gebouw aanmaken: HTTP 201, id=${TEST_GEBOUW_ID}"
          else
            check_fout "POST /api/gebouwen: HTTP ${CREATE_HTTP} (verwacht 201)"
            cat /tmp/create-resp.json >&2 || true
          fi

          # ── 10. Gebouwdetail ophalen ──────────────────────────────────────
          echo "--- Check 10: GET /api/gebouwen/:id ---"
          if [ -n "$TEST_GEBOUW_ID" ]; then
            DETAIL_HTTP=$(curl -sS --max-time 15 -o /tmp/detail-resp.json -w "%{http_code}" \
              -b "$COOKIEJAR" "${BASE_URL}/api/gebouwen/${TEST_GEBOUW_ID}" 2>/dev/null || echo "000")
            if [ "$DETAIL_HTTP" -eq 200 ]; then
              check_ok "gebouwdetail id=${TEST_GEBOUW_ID} geeft HTTP 200"
            else
              check_fout "GET /api/gebouwen/${TEST_GEBOUW_ID}: HTTP ${DETAIL_HTTP}"
            fi
          else
            echo "OVERGESLAGEN: check 10 (geen testgebouw-id)"
            TOTAAL=$((TOTAAL+1))
          fi

          # ── 11. Gebouw bijwerken ──────────────────────────────────────────
          echo "--- Check 11: PATCH /api/gebouwen/:id ---"
          if [ -n "$TEST_GEBOUW_ID" ]; then
            PATCH_HTTP=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" \
              -b "$COOKIEJAR" \
              -X PATCH "${BASE_URL}/api/gebouwen/${TEST_GEBOUW_ID}" \
              -H "Content-Type: application/json" \
              -d '{"naam":"__smoketest_bijgewerkt__"}' 2>/dev/null || echo "000")
            if [ "$PATCH_HTTP" -eq 200 ]; then
              check_ok "gebouw bijwerken: HTTP 200"
            else
              check_fout "PATCH /api/gebouwen/${TEST_GEBOUW_ID}: HTTP ${PATCH_HTTP}"
            fi
          else
            echo "OVERGESLAGEN: check 11 (geen testgebouw-id)"
            TOTAAL=$((TOTAAL+1))
          fi

          # ── 12. Upload bevestigd na vernieuwen (versie/status tweede keer) ─
          echo "--- Check 12: GET /api/versie/status (tweede meting, consistentiecheck) ---"
          STATUS2_RESP=$(curl -fsS --max-time 20 "${BASE_URL}/api/versie/status" 2>/dev/null || echo "")
          DB2_STATUS=$(echo "$STATUS2_RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).db||'')}catch(e){console.log('')}})" 2>/dev/null || echo "")
          if [ "$DB2_STATUS" = "ok" ]; then
            check_ok "systeemstatus tweede meting: db=ok"
          else
            check_fout "/api/versie/status (tweede): db=${DB2_STATUS}"
          fi

          # ── 13. API en frontend op zelfde commit ──────────────────────────
          echo "--- Check 13: API commit zichtbaar in /api/versie ---"
          if [ -n "$VERSIE_COMMIT" ]; then
            check_ok "commit-hash aanwezig: ${VERSIE_COMMIT}"
          else
            check_fout "/api/versie geeft geen commit-hash terug"
          fi

          # ── 14. Gebouw verwijderen (opruimen testgebouw) ──────────────────
          echo "--- Check 14: DELETE /api/gebouwen/:id (testgebouw opruimen) ---"
          if [ -n "$TEST_GEBOUW_ID" ]; then
            DELETE_HTTP=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" \
              -b "$COOKIEJAR" \
              -X DELETE "${BASE_URL}/api/gebouwen/${TEST_GEBOUW_ID}" 2>/dev/null || echo "000")
            if [ "$DELETE_HTTP" -eq 204 ]; then
              check_ok "gebouw verwijderen: HTTP 204"
            else
              check_fout "DELETE /api/gebouwen/${TEST_GEBOUW_ID}: HTTP ${DELETE_HTTP} (verwacht 204)"
            fi
          else
            echo "OVERGESLAGEN: check 14 (geen testgebouw-id)"
            TOTAAL=$((TOTAAL+1))
          fi

          # ── 15. Sessie na herlaad (laatste API-call met bestaande cookie) ─
          echo "--- Check 15: GET /api/dashboard/stats (sessie-validatie na herlaad) ---"
          SESSION_HTTP=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" \
            -b "$COOKIEJAR" "${BASE_URL}/api/dashboard/stats" 2>/dev/null || echo "000")
          if [ "$SESSION_HTTP" -eq 200 ]; then
            check_ok "sessie nog geldig na meerdere verzoeken: HTTP 200"
          else
            check_fout "Sessie-validatie: GET /api/dashboard/stats gaf HTTP ${SESSION_HTTP}"
          fi

          rm -f "$COOKIEJAR" /tmp/login-resp.json /tmp/users-resp.json \
                /tmp/stats-resp.json /tmp/gebouwen-resp.json \
                /tmp/create-resp.json /tmp/detail-resp.json

          echo ""
          echo "Smoketest resultaat: ${GESLAAGD}/${TOTAAL} checks geslaagd."

          if [ $FAIL -ne 0 ]; then
            echo "SMOKETEST GEFAALD — zie bovenstaande FOUT-regels." >&2
            exit 1
          fi
          echo "Smoketest geslaagd (${GESLAAGD}/${TOTAAL} checks)."
          echo "smoketest|$(date +%s)" >> /tmp/mijlpalen.txt

      # ─── OTA-update monteur-app (EAS Update) ───────────────────────────────
      # Na een geslaagde deploy + smoketest wordt de monteur-app automatisch
      # bijgewerkt via EAS Update (kanaal production). Zo krijgen monteurs
      # nooit een verouderde app doordat iemand vergeet handmatig
      # `eas update` te draaien. Native wijzigingen (nieuwe modules,
      # SDK-upgrade) vergen nog steeds een nieuwe APK — zie
      # docs/monteur-app-apk.md.
      # Vereist GitHub Secret: EXPO_TOKEN (Expo access token, account
      # futur-holding). Ontbreekt het token, dan wordt deze stap met een
      # duidelijke waarschuwing overgeslagen; de deploy zelf faalt daar
      # bewust niet op (web/API staan dan al correct live).
      #
      # DEPLOY_SNELHEID_01: de update wordt (1) beperkt tot Android — FPS
      # levert uitsluitend een Android-APK, de iOS-bundel was pure bouwtijd —
      # en (2) alleen gepubliceerd wanneer deze push werkelijk iets aan de
      # telefoon-app wijzigt (artifacts/monteur-app, of de gedeelde pakketten
      # die in de app-bundel belanden: lib/api-client-react en lib/ontwerp).
      # Bij twijfel (handmatige dispatch, force-push, before-commit niet
      # ophaalbaar) draait de update gewoon — overslaan is een optimalisatie,
      # nooit een risico.
      - name: OTA-update monteur-app (EAS Update, kanaal production)
        id: eas_update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # EXPO_PUBLIC_* wordt bij het exporteren van de update-bundle
          # ingebakken; zonder deze variabele zou de OTA-bundle geen
          # productiedomein hebben (eas.json 'build.env' geldt alleen voor
          # EAS Build, niet voor eas update). Zelfde waarde als het
          # production-buildprofiel.
          EXPO_PUBLIC_DOMAIN: connect.fps-one.nl
          VORIGE_COMMIT: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # ── Alleen draaien als er iets aan de telefoon-app is gewijzigd ──
          APP_PADEN=(artifacts/monteur-app lib/api-client-react lib/ontwerp)
          OTA_NODIG=1
          if [ "${GITHUB_EVENT_NAME}" = "push" ] \
             && [ -n "${VORIGE_COMMIT:-}" ] \
             && [ "${VORIGE_COMMIT}" != "0000000000000000000000000000000000000000" ]; then
            if git fetch --no-tags --depth=1 origin "${VORIGE_COMMIT}" 2>/dev/null; then
              GEWIJZIGD="$(git diff --name-only "${VORIGE_COMMIT}" "${GITHUB_SHA}" -- "${APP_PADEN[@]}" || echo "diff-mislukt")"
              if [ -z "${GEWIJZIGD}" ]; then
                OTA_NODIG=0
              fi
            else
              echo "Vorige commit niet ophaalbaar (force-push?) — OTA-update draait voor de zekerheid gewoon."
            fi
          fi

          if [ "${OTA_NODIG}" -eq 0 ]; then
            echo "Geen wijzigingen aan de telefoon-app in deze uitrol (${APP_PADEN[*]}) — OTA-update overgeslagen."
            echo "ota|$(date +%s)" >> /tmp/mijlpalen.txt
            exit 0
          fi

          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::warning::EXPO_TOKEN ontbreekt als GitHub Actions secret — OTA-update naar monteurs wordt OVERGESLAGEN. Voeg het token toe (Settings -> Secrets -> Actions) of draai handmatig: cd artifacts/monteur-app && npx eas-cli update --channel production --platform android."
            echo "ota|$(date +%s)" >> /tmp/mijlpalen.txt
            exit 0
          fi

          COMMIT_KORT="${GITHUB_SHA:0:7}"
          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "onbekend")

          cd artifacts/monteur-app
          npx eas-cli update \
            --channel production \
            --platform android \
            --non-interactive \
            --message "deploy ${COMMIT_KORT}: ${COMMIT_MSG}"

          echo "OTA-update gepubliceerd op kanaal production (alleen Android, commit ${COMMIT_KORT})."
          echo "ota|$(date +%s)" >> /tmp/mijlpalen.txt

      # ─── Tijd- en schijfbewaking (DEPLOY_SNELHEID_01 punt 4 + 5) ────────────
      # Draait alleen bij een verder geslaagde uitrol (bij falen mailt de
      # faalmelding-stap hieronder al). Twee bewakingen, één mail via exact
      # dezelfde Microsoft 365/Graph-koppeling:
      #  - duurde de uitrol langer dan 8 minuten → mail met de duur per stap;
      #  - meldde het deployscript SCHIJF_ALARM (schijf na opruimen nog boven
      #    85%) → dezelfde mail. Onder de grenzen: géén mail (geen mailmoeheid).
      - name: Tijd- en schijfbewaking (mail bij trage uitrol of volle schijf)
        if: success()
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || 'noreply@fpsbrandpreventie.nl' }}
          MAIL_MAILBOX: ${{ secrets.MAIL_MAILBOX || 'app@fpsbrandpreventie.nl' }}
          RENE_EMAIL: ${{ secrets.RENE_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAX_DUUR_SEC: "480"
        run: |
          set -euo pipefail

          NU=$(date +%s)
          DUUR=$((NU - DEPLOY_START))
          echo "Totale uitrolduur: ${DUUR}s (grens: ${MAX_DUUR_SEC}s)."

          # Schijfalarm uit de deploy-uitvoer (marker gezet door het script
          # op de VPS wanneer de schijf ook ná opruimen boven de 85% staat).
          SCHIJF_ALARM="$( (grep -E '^SCHIJF_ALARM\|' /tmp/deploy-output.log 2>/dev/null || true) | head -1 | cut -d'|' -f2)"

          TE_TRAAG=0
          [ "${DUUR}" -gt "${MAX_DUUR_SEC}" ] && TE_TRAAG=1

          if [ "${TE_TRAAG}" -eq 0 ] && [ -z "${SCHIJF_ALARM}" ]; then
            echo "Uitrol binnen de tijdgrens en schijf onder de grens — geen mail."
            exit 0
          fi

          # Duur per workflow-fase uit de mijlpalen (opeenvolgende verschillen).
          FASE_TIJDEN="$(awk -F'|' 'NR>1 {printf "  %s: %ds\n", $1, $2 - vorig} {vorig=$2}' /tmp/mijlpalen.txt 2>/dev/null || echo "  (geen mijlpalen beschikbaar)")"
          # Duur per serverstap uit de deploy-uitvoer (TIJD|stap|Ns).
          SERVER_TIJDEN="$( (grep -E '^TIJD\|' /tmp/deploy-output.log 2>/dev/null || true) | awk -F'|' '{printf "  %s: %s\n", $2, $3}')"
          [ -n "${SERVER_TIJDEN}" ] || SERVER_TIJDEN="  (geen serverstap-tijden gevonden in de deploy-uitvoer)"

          REDENEN=""
          [ "${TE_TRAAG}" -eq 1 ] && REDENEN="- Uitrol duurde ${DUUR}s, langer dan de grens van ${MAX_DUUR_SEC}s (8 minuten)."$'\n'
          [ -n "${SCHIJF_ALARM}" ] && REDENEN="${REDENEN}- Schijf op de server staat ook na het opruimen van oude Docker-images op ${SCHIJF_ALARM}% (grens: 85%)."$'\n'

          if [ -z "${AZURE_TENANT_ID:-}" ] || [ -z "${AZURE_CLIENT_ID:-}" ] || [ -z "${AZURE_CLIENT_SECRET:-}" ] || [ -z "${RENE_EMAIL:-}" ]; then
            echo "Mailconfig ontbreekt als GitHub Actions secret; bewakingsmelding kan niet verzonden worden. Redenen die gemeld zouden zijn:" >&2
            printf '%s' "${REDENEN}" >&2
            exit 0
          fi

          TOKEN=$(curl -fsS -X POST \
            "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
            -d "client_id=${AZURE_CLIENT_ID}" \
            -d "client_secret=${AZURE_CLIENT_SECRET}" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "grant_type=client_credentials" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).access_token||'')}catch(e){console.log('')}})")

          if [ -z "$TOKEN" ]; then
            echo "Kon geen Graph-token ophalen; bewakingsmelding kan niet verzonden worden." >&2
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "onbekend")
          BODY="Productie-release GESLAAGD, maar de deploybewaking sloeg aan.

          Commit: ${GITHUB_SHA}
          Omschrijving: ${COMMIT_MSG}
          Totale uitrolduur: ${DUUR}s

          Redenen:
          ${REDENEN}
          Duur per workflow-fase:
          ${FASE_TIJDEN}

          Duur per serverstap (deployscript op de VPS):
          ${SERVER_TIJDEN}

          Actions-run: ${RUN_URL}"

          PAYLOAD=$(MAIL_BODY="$BODY" node -e "
            const body = {
              message: {
                subject: 'FPS Connect: deploybewaking — uitrol traag of schijf vol',
                body: { contentType: 'Text', content: process.env.MAIL_BODY.replace(/^ {10}/gm, '') },
                toRecipients: [{ emailAddress: { address: process.env.RENE_EMAIL } }],
                from: { emailAddress: { address: process.env.MAIL_FROM, name: 'FPS Connect' } },
              },
              saveToSentItems: false,
            };
            console.log(JSON.stringify(body));
          ")

          HTTP_CODE=$(curl -sS -o /tmp/graph-response.json -w "%{http_code}" \
            -X POST "https://graph.microsoft.com/v1.0/users/${MAIL_MAILBOX}/sendMail" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Bewakingsmelding verzonden naar René."
          else
            echo "Verzenden van bewakingsmelding gaf HTTP $HTTP_CODE." >&2
            cat /tmp/graph-response.json >&2 || true
            exit 0
          fi

      # ─── Meldingen bij falen ────────────────────────────────────────────────
      # René moet een kapotte release direct horen, niet later ontdekken via de
      # Actions-tab. Verstuurt via dezelfde Microsoft 365/Graph-mailkoppeling
      # als de app zelf (client-credentials, geen wachtwoord). Bij een
      # geslaagde deploy géén melding (voorkomt mailmoeheid).
      - name: Faalmelding e-mailen naar René
        if: failure()
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || 'noreply@fpsbrandpreventie.nl' }}
          MAIL_MAILBOX: ${{ secrets.MAIL_MAILBOX || 'app@fpsbrandpreventie.nl' }}
          RENE_EMAIL: ${{ secrets.RENE_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${AZURE_TENANT_ID:-}" ] || [ -z "${AZURE_CLIENT_ID:-}" ] || [ -z "${AZURE_CLIENT_SECRET:-}" ] || [ -z "${RENE_EMAIL:-}" ]; then
            echo "Mailconfig (AZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET/RENE_ALERT_EMAIL) ontbreekt als GitHub Actions secret; faalmelding kan niet verzonden worden." >&2
            exit 0
          fi

          TOKEN=$(curl -fsS -X POST \
            "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
            -d "client_id=${AZURE_CLIENT_ID}" \
            -d "client_secret=${AZURE_CLIENT_SECRET}" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "grant_type=client_credentials" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).access_token||'')}catch(e){console.log('')}})")

          if [ -z "$TOKEN" ]; then
            echo "Kon geen Graph-token ophalen; faalmelding kan niet verzonden worden." >&2
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "onbekend")
          SMOKETEST_OK="${{ steps.smoketest.outcome }}"
          if [ "$SMOKETEST_OK" = "failure" ]; then
            REDEN="Post-deploy smoketest gefaald: /api/healthz, login of /api/gebruikers reageert niet correct op connect.fps-one.nl."
          else
            REDEN="Deploy-stap gefaald (build, migratie of containers-up op de VPS)."
          fi
          BODY=$(cat <<EOF
          Productie-release GEFAALD.

          Commit: ${GITHUB_SHA}
          Omschrijving: ${COMMIT_MSG}
          Reden: ${REDEN}
          Actions-run: ${RUN_URL}

          Controleer de run-logs en de productiestatus zo snel mogelijk.
          EOF
          )

          PAYLOAD=$(MAIL_BODY="$BODY" node -e "
            const body = {
              message: {
                subject: 'FPS Connect: productie-release GEFAALD',
                body: { contentType: 'Text', content: process.env.MAIL_BODY },
                toRecipients: [{ emailAddress: { address: process.env.RENE_EMAIL } }],
                from: { emailAddress: { address: process.env.MAIL_FROM, name: 'FPS Connect' } },
              },
              saveToSentItems: false,
            };
            console.log(JSON.stringify(body));
          ")

          HTTP_CODE=$(curl -sS -o /tmp/graph-response.json -w "%{http_code}" \
            -X POST "https://graph.microsoft.com/v1.0/users/${MAIL_MAILBOX}/sendMail" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Faalmelding verzonden naar René."
          else
            echo "Verzenden van faalmelding gaf HTTP $HTTP_CODE." >&2
            cat /tmp/graph-response.json >&2 || true
            exit 0
          fi
