name: Deploy naar productie

# ─── Automatische deploy ─────────────────────────────────────────────────────
# Elke push naar main deployt automatisch naar de productie-VPS
# (connect.fps-one.nl); er is bewust GEEN handmatige goedkeuringsstap.
# De feitelijke deploystappen staan in scripts/deploy-production.sh — dat
# script wordt naar de server gekopieerd en daar uitgevoerd, zodat de versie
# uit de zojuist gepushte commit draait en de `git reset --hard` op de server
# het lopende script niet kan overschrijven.
#
# Benodigde GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   PROD_SSH_KEY   — private SSH-sleutel (volledige meerregelige PEM-inhoud)
#   PROD_SSH_HOST  — 149.210.181.47
#   PROD_SSH_USER  — rene
#   PROD_SSH_PORT  — SSH-poort (optioneel; standaard 22)
# Voor de post-deploy smoketest (stap na de containers-up):
#   SMOKETEST_EMAIL    — e-mailadres van het smoketest-account (bijv. René's login)
#   SMOKETEST_PASSWORD — wachtwoord van dat account
# Optioneel voor de faalmelding per e-mail:
#   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
#   MAIL_FROM / MAIL_MAILBOX / RENE_ALERT_EMAIL
#
# ─── Deploybeleid (vastgesteld 10 juli 2026): geen aparte goedkeuring ────────
# Productie is de actieve acceptatieomgeving; fixes gaan direct naar productie
# zodra de gates groen zijn (zie docs/PRODUCTION_RUNBOOK.md).

on:
  # Automatisch bij elke push naar main
  push:
    branches: [main]

  # Of handmatig starten vanuit de GitHub Actions-tab
  workflow_dispatch:
    inputs:
      noodfix_reden:
        description: >-
          Geef hier de reden op om de CI-poort (en pre-deploy controles) bewust
          te omzeilen. Niet-leeg = noodfix-modus: de poort wordt overgeslagen,
          maar er gaat direct een melding naar René met jouw naam, de commit en
          deze reden. Leeg laten = normale check blijft actief.
          Gebruik alleen als productie plat ligt en CI rood is.
          Zie docs/antwoorden/CI_DEPLOY_POORT.md voor de stap-voor-stap instructie.
        required: false
        default: ""
      test_faalmail:
        description: >-
          Typ TEST om de run bewust te laten falen vóór de server wordt
          aangeraakt, puur om de faalmelding per e-mail te testen.
          Productie wordt hierbij nooit geraakt.
        required: false
        default: ""
      test_connect_mail:
        description: >-
          Optioneel ontvangstadres voor één echte Connect-testmail na een
          geslaagde handmatige deploy. Leeg laten = mailproef overslaan.
        required: false
        default: ""
      herstel_smoketest_account:
        description: >-
          Typ HERSTEL om bij een handmatige bewijsrun het vaste productie-
          smoketestaccount met een eenmalig, gemaskeerd wachtwoord klaar te
          zetten wanneer de twee SMOKETEST-secrets ontbreken.
        required: false
        default: ""

# Nooit twee deployments tegelijk; een lopende deploy wordt nooit geannuleerd,
# een nieuwe push wacht netjes tot de vorige klaar is.
concurrency:
  # Een faalmailtest raakt de server nooit. Geef hem daarom een eigen wachtrij:
  # nieuwe productie-pushes mogen de bewijsrun niet annuleren, en de test houdt
  # een echte deploy ook niet tegen.
  group: >-
    ${{ github.event_name == 'workflow_dispatch' &&
        github.event.inputs.test_faalmail == 'TEST' &&
        'production-faalmail-test' || 'production-deploy' }}
  cancel-in-progress: false

# Expliciete token-scopes: contents-read voor de checkout, actions-read voor
# de adaptieve tijdbewaking (mediaan van eerdere workflow-runs via de API).
# Zonder expliciete declaratie hangt dit van repository-defaults af en zou
# de mediaanopvraag stil kunnen falen (= nooit een tijdmelding).
permissions:
  contents: read
  actions: read
  checks: read

jobs:
  deploy:
    name: Deploy naar productie
    runs-on: ubuntu-latest

    steps:
      # Checkout is nodig om scripts/deploy-production.sh (en de commit-
      # omschrijving voor de faalmelding) beschikbaar te hebben.
      - uses: actions/checkout@v4

      # ─── Testmarker-controle (ROLLBACKTEST/TERUGVALTEST) ─────────────────────
      # Blokkeert de deploy als er een sabotage-/terugvaltest-marker in de
      # api-server bronbestanden staat. Achtergrond: op 18 aug 2026 belandde
      # een bewust kapot startblok via een taakmerge op main en veroorzaakte
      # een mislukte deploy van ~10 min. Deze controle draait altijd als eerste
      # en wordt bewust NIET door de noodfix-bypass overgeslagen: een sabotage-
      # marker is nooit een deployment-blokkade die een noodfix rechtvaardigt.
      # Uitzondering: takken waarvan de naam "terugvaltest" of "rollbacktest"
      # bevat mogen de marker wél hebben (bewuste terugvaltest).
      - name: Testmarker-controle (ROLLBACKTEST/TERUGVALTEST)
        run: |
          set -euo pipefail
          echo "Testmarker-controle (ROLLBACKTEST/TERUGVALTEST)" > /tmp/faalstap.txt
          # Takkenaam afleiden uit GITHUB_REF (bijv. refs/heads/terugvaltest/xyz → terugvaltest/xyz).
          TAKNAAM="${GITHUB_REF#refs/heads/}"
          bash scripts/check-testmarker.sh "${TAKNAAM}" 2>&1 | tee /tmp/stap-uitvoer.log
          # Propageer de exitcode van het script (tee maskeert hem anders).
          exit "${PIPESTATUS[0]}"

      # ─── Tijdbewaking (DEPLOY_SNELHEID_01 punt 4) ────────────────────────────
      # Starttijd en mijlpalen vastleggen; de bewakingsstap onderaan rekent er
      # de duur per fase mee uit en mailt René alleen bij een verslechtering
      # (>1,5× de mediaan van de laatste tien uitrollen, max. één mail per dag).
      - name: Starttijd vastleggen
        run: |
          echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "start|$(date +%s)" > /tmp/mijlpalen.txt

      # ─── CI-poort: blokkeer deploy als CI rood staat op deze commit ──────────
      # Bij elke automatische push naar main (en bij handmatige dispatch zonder
      # noodfix_reden op de main-branch) wordt de GitHub check-runs API bevraagd.
      # Is de CI-job nog niet klaar of rood → deploy stopt met duidelijke melding.
      # Bypass: workflow_dispatch met een niet-lege noodfix_reden overslaat deze
      # stap, maar stuurt daarna direct een noodfix-melding naar René.
      # Handmatige dispatch op een andere tak (terugvaltest-pad) slaat ook over.
      - name: CI-poort — controleer CI-status op deze commit
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
           github.event.inputs.noodfix_reden == '' &&
           github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "CI-poort — controleer CI-status op deze commit" > /tmp/faalstap.txt

          echo "Controleer CI-status voor commit ${GITHUB_SHA}..."

          # Wacht tot 20 minuten: push-events voor deploy en CI starten
          # vrijwel gelijktijdig en de CI-run zelf duurt ~10 minuten. Met de
          # oude 3 minuten gaf de poort het op terwijl CI nog liep en faalde
          # élke push-deploy (18-08-2026).
          MAX_WACHT=1200
          INTERVAL=15
          GEWACHT=0
          CI_UITKOMST="onbekend"

          while [ "${GEWACHT}" -lt "${MAX_WACHT}" ]; do
            RESP=$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              2>/dev/null || echo "")

            if [ -n "${RESP}" ]; then
              CI_UITKOMST=$(echo "${RESP}" | node -e "
                let d = '';
                process.stdin.on('data', c => d += c);
                process.stdin.on('end', () => {
                  try {
                    const runs = JSON.parse(d).check_runs || [];
                    // Zoek alleen GitHub-Actions-runs met 'CI' of 'Typecheck' in de naam
                    const ci = runs.filter(r =>
                      r.app && r.app.slug === 'github-actions' &&
                      (r.name === 'Typecheck & build' || r.name.toLowerCase().includes('ci'))
                    );
                    // Nog geen check-run aangemaakt: CI is net gestart of gepland.
                    // Behandel als 'bezig' en blijf pollen tot de deadline.
                    if (ci.length === 0) { console.log('geen-ci-nog'); return; }
                    const nogBezig = ci.filter(r => r.status !== 'completed');
                    if (nogBezig.length > 0) { console.log('bezig'); return; }
                    const gefaald = ci.filter(
                      r => r.conclusion !== 'success' && r.conclusion !== 'skipped'
                    );
                    if (gefaald.length > 0) {
                      const namen = gefaald.map(r => r.name + ' (' + r.conclusion + ')').join(', ');
                      process.stderr.write('Gefaalde CI-jobs: ' + namen + '\n');
                      console.log('rood');
                      return;
                    }
                    console.log('groen');
                  } catch (e) { console.log('fout'); }
                });
              " 2>/tmp/ci-falen.txt || echo "fout")
            else
              CI_UITKOMST="fout"
            fi

            # Blijf pollen zolang CI nog bezig is, nog niet zichtbaar is, of
            # de API tijdelijk niet bereikbaar was. Alleen 'groen' en 'rood'
            # breken de lus onmiddellijk.
            case "${CI_UITKOMST}" in
              groen|rood) break ;;
              bezig)
                echo "CI draait nog op commit ${GITHUB_SHA} — wacht ${INTERVAL}s (totaal: ${GEWACHT}s)..."
                ;;
              geen-ci-nog)
                echo "Geen CI-check-run zichtbaar voor ${GITHUB_SHA} — wacht ${INTERVAL}s (totaal: ${GEWACHT}s)..."
                ;;
              fout)
                echo "GitHub API tijdelijk niet bereikbaar — wacht ${INTERVAL}s (totaal: ${GEWACHT}s)..."
                ;;
            esac
            sleep "${INTERVAL}"
            GEWACHT=$((GEWACHT + INTERVAL))
          done

          GEFAALDE_JOBS=$(cat /tmp/ci-falen.txt 2>/dev/null || echo "")

          case "${CI_UITKOMST}" in
            groen)
              echo "CI-poort: GROEN — CI geslaagd op commit ${GITHUB_SHA}. Deploy mag doorgaan."
              ;;
            rood)
              echo "::error::CI-POORT GEBLOKKEERD: de CI-run op commit ${GITHUB_SHA} is rood."
              [ -n "${GEFAALDE_JOBS}" ] && echo "  ${GEFAALDE_JOBS}"
              echo "Repareer de CI eerst, of gebruik handmatige workflow_dispatch met een"
              echo "noodfix_reden om de poort te omzeilen (zie docs/antwoorden/CI_DEPLOY_POORT.md)."
              exit 1
              ;;
            bezig)
              echo "::error::CI-POORT GEBLOKKEERD: CI draait nog op commit ${GITHUB_SHA}"
              echo "na ${MAX_WACHT}s wachten. Probeer later opnieuw of gebruik noodfix_reden."
              exit 1
              ;;
            geen-ci-nog)
              echo "::error::CI-POORT GEBLOKKEERD: geen CI-run aangemeld voor commit ${GITHUB_SHA}"
              echo "na ${MAX_WACHT}s wachten. Controleer of de CI-workflow actief is, of gebruik noodfix_reden."
              exit 1
              ;;
            *)
              echo "::error::CI-POORT GEBLOKKEERD: kon de CI-status niet ophalen via GitHub API."
              echo "Controleer de actions-rechten van de workflow, of gebruik noodfix_reden."
              exit 1
              ;;
          esac

      # ─── Noodfix-melding ──────────────────────────────────────────────────────
      # Als noodfix_reden opgegeven is, is de CI-poort hierboven overgeslagen.
      # Dit is bewust: een noodfix mag nooit stilzwijgend passeren. Hier wordt:
      #  1. het gebruik zichtbaar gelogd (commit, tijdstip, persoon, reden), en
      #  2. direct dezelfde faalmail verstuurd zodat René het weet.
      - name: Noodfix — vastleggen en melding sturen
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.noodfix_reden != ''
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || 'noreply@fpsbrandpreventie.nl' }}
          MAIL_MAILBOX: ${{ secrets.MAIL_MAILBOX || 'app@fpsbrandpreventie.nl' }}
          RENE_EMAIL: ${{ secrets.RENE_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOODFIX_REDEN: ${{ github.event.inputs.noodfix_reden }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          TIJDSTIP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          echo "::warning::NOODFIX ACTIEF — CI-poort en pre-deploy controles bewust omzeild."
          echo "  Commit  : ${GITHUB_SHA}"
          echo "  Tijdstip: ${TIJDSTIP}"
          echo "  Persoon : ${ACTOR}"
          echo "  Reden   : ${NOODFIX_REDEN}"

          # De noodfix-melding is verplicht: een bypass mag nooit stilzwijgend passeren.
          # Ontbrekende mailconfig of een mislukte Graph-aanroep stopt de run vóór de
          # deploy — zo weet René altijd van elke noodfix.
          if [ -z "${AZURE_TENANT_ID:-}" ] || [ -z "${AZURE_CLIENT_ID:-}" ] || \
             [ -z "${AZURE_CLIENT_SECRET:-}" ] || [ -z "${RENE_EMAIL:-}" ]; then
            echo "::error::NOODFIX GEBLOKKEERD: mailconfig (AZURE_TENANT_ID / AZURE_CLIENT_ID /" \
              "AZURE_CLIENT_SECRET / RENE_ALERT_EMAIL) ontbreekt als GitHub Actions secret." >&2
            echo "Voeg de ontbrekende secrets toe voordat je de noodfix-route gebruikt," >&2
            echo "zodat de verplichte audit-melding naar René kan worden verstuurd." >&2
            exit 1
          fi

          HTTP_TOKEN_CODE=$(curl -sS -o /tmp/token-resp.json -w "%{http_code}" -X POST \
            "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
            -d "client_id=${AZURE_CLIENT_ID}" \
            -d "client_secret=${AZURE_CLIENT_SECRET}" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "grant_type=client_credentials" || echo "000")
          TOKEN=$(node -e "try{const d=require('fs').readFileSync('/tmp/token-resp.json','utf8');console.log(JSON.parse(d).access_token||'')}catch(e){console.log('')}" 2>/dev/null || echo "")

          if [ -z "${TOKEN}" ]; then
            echo "::error::NOODFIX GEBLOKKEERD: kon geen Graph-token ophalen (HTTP ${HTTP_TOKEN_CODE})." \
              "Controleer AZURE_TENANT_ID, AZURE_CLIENT_ID en AZURE_CLIENT_SECRET in de GitHub-secrets." >&2
            echo "Azure-antwoord:" >&2
            cat /tmp/token-resp.json >&2 || true
            exit 1
          fi

          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "onbekend")

          BODY=$(printf '%s\n' \
            "NOODFIX: CI-poort handmatig omzeild." \
            "" \
            "Commit  : ${GITHUB_SHA}" \
            "Bericht : ${COMMIT_MSG}" \
            "Tijdstip: ${TIJDSTIP}" \
            "Persoon : ${ACTOR}" \
            "Reden   : ${NOODFIX_REDEN}" \
            "" \
            "De CI-poort is bewust overgeslagen. Controleer of de commit veilig is" \
            "en zorg dat CI alsnog groen wordt gemaakt." \
            "" \
            "Actions-run: ${RUN_URL}")

          PAYLOAD=$(MAIL_BODY="${BODY}" node -e "
            const body = {
              message: {
                subject: 'FPS Connect: NOODFIX \u2014 CI-poort omzeild door ' + process.env.ACTOR,
                body: { contentType: 'Text', content: process.env.MAIL_BODY },
                toRecipients: [{ emailAddress: { address: process.env.RENE_EMAIL } }],
                from: { emailAddress: { address: process.env.MAIL_FROM, name: 'FPS Connect' } },
              },
              saveToSentItems: false,
            };
            console.log(JSON.stringify(body));
          ")

          HTTP_CODE=$(curl -sS -o /tmp/noodfix-graph-response.json -w "%{http_code}" \
            -X POST "https://graph.microsoft.com/v1.0/users/${MAIL_MAILBOX}/sendMail" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}")

          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
            echo "Noodfix-melding verzonden naar René."
          else
            echo "::error::NOODFIX GEBLOKKEERD: verzenden van de audit-melding gaf HTTP ${HTTP_CODE}." >&2
            cat /tmp/noodfix-graph-response.json >&2 || true
            exit 1
          fi

      # ─── Controles vóór de VPS wordt aangeraakt (MERGE_01 §3.2) ─────────────
      # De Docker-build bundelt met esbuild en controleert geen types; op
      # 8 aug 2026 belandde daardoor code met ongedefinieerde variabelen op
      # productie. Deze stappen draaien dezelfde controles als de CI, maar
      # binnen de deploy zelf: faalt er één, dan wordt er niets uitgerold.
      # Dit is geen goedkeuringspoort — elke push naar main rolt nog steeds
      # automatisch uit zodra de controles slagen.
      #
      # Noodfix-bypass: workflow_dispatch met een niet-lege noodfix_reden
      # slaat deze controles over (gedocumenteerd in
      # docs/antwoorden/CI_DEPLOY_POORT.md).
      - name: Noodfix-bypass melden
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.noodfix_reden != ''
        run: |
          echo "::warning::NOODFIX-BYPASS ACTIEF — pre-deploy controles worden bewust overgeslagen."

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installeer dependencies (voor controles)
        run: pnpm install --frozen-lockfile

      # Elke kritieke stap schrijft eerst zijn naam naar /tmp/faalstap.txt en
      # spiegelt zijn uitvoer naar /tmp/stap-uitvoer.log. Faalt de run, dan
      # weet de faalmail-stap onderaan precies wélke stap brak en wat de
      # laatste uitvoerregels waren (HERSTEL_MAIL_01 punt 4).
      - name: Controle 1/3 — typecheck
        if: github.event.inputs.noodfix_reden == ''
        run: |
          set -euo pipefail
          echo "Controle 1/3 — typecheck" > /tmp/faalstap.txt
          pnpm run typecheck 2>&1 | tee /tmp/stap-uitvoer.log

      - name: Controle 2/3 — dubbele-routes-controle
        if: github.event.inputs.noodfix_reden == ''
        run: |
          set -euo pipefail
          echo "Controle 2/3 — dubbele-routes-controle" > /tmp/faalstap.txt
          pnpm --filter @workspace/scripts run check-dubbele-routes 2>&1 | tee /tmp/stap-uitvoer.log

      # KLANTLOOS_01 fase 3: faalt zodra de klantrol of een "of klant"-
      # autorisatievariant terugkeert in Connect.
      - name: Controle 3/3 — klantloos-controle
        if: github.event.inputs.noodfix_reden == ''
        run: |
          set -euo pipefail
          echo "Controle 3/3 — klantloos-controle" > /tmp/faalstap.txt
          pnpm --filter @workspace/scripts run klantloos-check 2>&1 | tee /tmp/stap-uitvoer.log

      # SESSIE_01: verbiedt session["gebruikerId"] en session["naam"/"gebruikerNaam"].
      # Vangt de stille autorisatie-breuk die in aug 2026 in 8+ routes zat.
      - name: Sessieveld-antipatroon-controle
        if: github.event.inputs.noodfix_reden == ''
        run: |
          set -euo pipefail
          echo "Sessieveld-antipatroon-controle" > /tmp/faalstap.txt
          pnpm --filter @workspace/api-server run check-sessie-velden 2>&1 | tee /tmp/stap-uitvoer.log

      # Testmodus voor de faalmelding: simuleert een fout vóór de server wordt
      # aangeraakt. De mailstap herkent deze marker, maar de run blijft groen:
      # zo bewijst de test uitsluitend de mailketen en opent hij geen vals
      # uitrolincident in Connect.
      - name: Faalmail-test (bewuste simulatie)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_faalmail == 'TEST'
        run: |
          set -euo pipefail
          echo "Faalmail-test (bewuste simulatie)" > /tmp/faalstap.txt
          {
            echo "Dit is een bewuste testfout om de faalmelding te controleren."
            echo "De productieserver is NIET aangeraakt."
            echo "De test-run vervolgt bewust groen na de faalmail."
          } | tee /tmp/stap-uitvoer.log

      - name: SSH-sleutel en hostkey instellen
        if: github.event.inputs.test_faalmail != 'TEST'
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PROD_SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          echo "SSH-sleutel en hostkey instellen" > /tmp/faalstap.txt
          : > /tmp/stap-uitvoer.log
          echo "controles-en-install|$(date +%s)" >> /tmp/mijlpalen.txt

          if [ -z "${PROD_SSH_KEY:-}" ] || [ -z "${PROD_SSH_HOST:-}" ] \
            || [ -z "${PROD_SSH_HOST_FINGERPRINT:-}" ]; then
            echo "FOUT: PROD_SSH_KEY, PROD_SSH_HOST en/of PROD_SSH_HOST_FINGERPRINT ontbreken." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Sleutel naar bestand schrijven zonder hem ooit te tonen.
          # Ondersteunt zowel multiline-secrets (echte newlines) als platte
          # strings met \n-sequenties (Replit-opslagformaat).
          printf '%s' "${PROD_SSH_KEY}" | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Accepteer uitsluitend de vooraf buiten deze verbinding
          # geverifieerde VPS-hostkey; een kale ssh-keyscan is geen bewijs.
          bash deploy/pin-ssh-host-key.sh ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'SSHCONFIG'
          Host *
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
          SSHCONFIG
          chmod 600 ~/.ssh/config

      - name: Deployscript naar de server kopiëren
        if: github.event.inputs.test_faalmail != 'TEST'
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          echo "Deployscript naar de server kopiëren" > /tmp/faalstap.txt
          : > /tmp/stap-uitvoer.log
          # Vanaf hier raken we de productieserver aan; de faalmail meldt dat.
          echo "PROD_AANGERAAKT=1" >> "$GITHUB_ENV"
          if [ -z "${PROD_SSH_USER:-}" ]; then
            echo "FOUT: GitHub Secret PROD_SSH_USER ontbreekt." >&2
            exit 1
          fi
          scp -i ~/.ssh/deploy_key -P "${PROD_SSH_PORT}" \
            scripts/deploy-production.sh \
            "${PROD_SSH_USER}@${PROD_SSH_HOST}:/tmp/deploy-production.sh" 2>&1 | tee /tmp/stap-uitvoer.log

      - name: Deploy uitvoeren op de VPS
        if: github.event.inputs.test_faalmail != 'TEST'
        id: deploy
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          # Dispatch-input nooit direct in run:-code interpoleren (injection-risico).
          # Hier doorgegeven als omgevingsvariabele en daarna veilig getest.
          NOODFIX_REDEN: ${{ github.event.inputs.noodfix_reden }}
          # UITROL_BEWAKING_01: gedeelde sleutel waarmee de api-container
          # terugmeldingen van deze workflow accepteert (POST /api/uitrol/rapport).
          UITROL_RAPPORT_SLEUTEL: ${{ secrets.UITROL_RAPPORT_SLEUTEL }}
        run: |
          set -euo pipefail
          echo "Deploy uitvoeren op de VPS" > /tmp/faalstap.txt
          # UITROL_BEWAKING_01: sleutel nooit rauw in de remote-commandoregel
          # interpoleren (shell-metatekens = injectie-/breukrisico). Base64 is
          # shell-veilig; het deployscript decodeert hem weer.
          UITROL_SLEUTEL_B64="$(printf '%s' "${UITROL_RAPPORT_SLEUTEL:-}" | base64 -w0)"
          # De exitcode van het script op de server bepaalt direct het
          # resultaat van deze stap: iedere fout stopt de workflow (pipefail
          # laat de ssh-exitcode door de tee heen). De uitvoer gaat óók naar
          # /tmp/deploy-output.log, zodat de tijd- en schijfbewaking onderaan
          # de TIJD|- en SCHIJF_ALARM|-regels van het script kan lezen.
          # Typecheck in het api-image alleen bij noodfix (controles vooraf
          # overgeslagen); bij een normale deploy is de volledige workspace-
          # typecheck al op deze runner gedraaid en is herhalen pure dubbeling.
          if [ -n "${NOODFIX_REDEN:-}" ]; then
            TYPECHECK_IN_IMAGE=1
          else
            TYPECHECK_IN_IMAGE=0
          fi
          # DEPLOY_COMMIT: de exacte commit van deze run. Een dispatch op een
          # tak rolt zo die tak uit (terugval-testruns); een push naar main
          # blijft gewoon de main-commit uitrollen.
          ssh -i ~/.ssh/deploy_key -p "${PROD_SSH_PORT}" \
            "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
            "TYPECHECK_IN_IMAGE=${TYPECHECK_IN_IMAGE} DEPLOY_COMMIT=${GITHUB_SHA} UITROL_RAPPORT_SLEUTEL_B64=${UITROL_SLEUTEL_B64} bash /tmp/deploy-production.sh" 2>&1 | tee /tmp/deploy-output.log /tmp/stap-uitvoer.log
          echo "vps-deploy|$(date +%s)" >> /tmp/mijlpalen.txt

      # Alleen voor een expliciete handmatige bewijsrun wanneer de vaste
      # repositorysecrets ontbreken. Het willekeurige wachtwoord wordt vóór
      # gebruik gemaskeerd, gaat via stdin naar de VPS en leeft uitsluitend
      # binnen deze Actions-job.
      - name: Smoketest-serviceaccount eenmalig klaarzetten
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.herstel_smoketest_account == 'HERSTEL' &&
          github.event.inputs.test_faalmail != 'TEST'
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          SMOKETEST_EMAIL_SECRET: ${{ secrets.SMOKETEST_EMAIL }}
          SMOKETEST_PASSWORD_SECRET: ${{ secrets.SMOKETEST_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Smoketest-serviceaccount eenmalig klaarzetten" > /tmp/faalstap.txt
          exec > >(tee /tmp/stap-uitvoer.log) 2>&1

          if [ -n "${SMOKETEST_EMAIL_SECRET:-}" ] && [ -n "${SMOKETEST_PASSWORD_SECRET:-}" ]; then
            echo "Bestaande SMOKETEST-secrets zijn compleet; eenmalig herstel is niet nodig."
            exit 0
          fi
          if [ -n "${SMOKETEST_EMAIL_SECRET:-}" ] || [ -n "${SMOKETEST_PASSWORD_SECRET:-}" ]; then
            echo "SMOKETEST_EMAIL en SMOKETEST_PASSWORD zijn slechts gedeeltelijk ingesteld; herstel eerst de repositorysecrets." >&2
            exit 1
          fi

          PROEF_SMOKETEST_EMAIL="smoketest@fps-brandpreventie.nl"
          PROEF_SMOKETEST_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::${PROEF_SMOKETEST_PASSWORD}"

          printf '%s\n' "${PROEF_SMOKETEST_PASSWORD}" | \
            ssh -i ~/.ssh/deploy_key -p "${PROD_SSH_PORT}" \
              "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
              'set -euo pipefail
               cd /opt/fps-one
               IFS= read -r SMOKETEST_PASSWORD
               export SMOKETEST_PASSWORD
               docker compose -f deploy/docker-compose.production.yml \
                 --env-file deploy/.env.production \
                 run --rm -T -e SMOKETEST_PASSWORD migrate \
                 pnpm --filter @workspace/db run smoketest-account
               unset SMOKETEST_PASSWORD'

          {
            echo "PROEF_SMOKETEST_EMAIL=${PROEF_SMOKETEST_EMAIL}"
            echo "PROEF_SMOKETEST_PASSWORD=${PROEF_SMOKETEST_PASSWORD}"
          } >> "$GITHUB_ENV"
          echo "Eenmalig smoketestaccount is klaar voor deze job."

      # ─── Smoketest na deploy ─────────────────────────────────────────────────
      # Drie kritieke API-controles uitgevoerd vanaf de Actions runner (extern,
      # dezelfde route als een echte gebruiker). Geeft direct zekerheid dat de
      # release niet heeft inloggen of de kernapplicatie gebroken heeft.
      # Credentials staan als GitHub Actions secrets, nooit als platte tekst.
      - name: Smoketest uitvoeren
        if: github.event.inputs.test_faalmail != 'TEST'
        id: smoketest
        env:
          SMOKETEST_EMAIL_SECRET: ${{ secrets.SMOKETEST_EMAIL }}
          SMOKETEST_PASSWORD_SECRET: ${{ secrets.SMOKETEST_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Smoketest uitvoeren" > /tmp/faalstap.txt
          exec > >(tee /tmp/stap-uitvoer.log) 2>&1

          SMOKETEST_EMAIL="${SMOKETEST_EMAIL_SECRET:-${PROEF_SMOKETEST_EMAIL:-}}"
          SMOKETEST_PASSWORD="${SMOKETEST_PASSWORD_SECRET:-${PROEF_SMOKETEST_PASSWORD:-}}"
          export SMOKETEST_EMAIL SMOKETEST_PASSWORD
          if [ -z "${SMOKETEST_EMAIL:-}" ] || [ -z "${SMOKETEST_PASSWORD:-}" ]; then
            echo "WAARSCHUWING: SMOKETEST_EMAIL en/of SMOKETEST_PASSWORD ontbreekt als GitHub Actions secret; smoketest wordt overgeslagen." >&2
            echo "smoketest|$(date +%s)" >> /tmp/mijlpalen.txt
            exit 0
          fi

          BASE_URL="https://connect.fps-one.nl"
          COOKIEJAR=$(mktemp)
          FAIL=0
          GESLAAGD=0
          TOTAAL=0

          # Helper: check-resultaat registreren
          check_ok() { echo "OK: $1"; GESLAAGD=$((GESLAAGD+1)); TOTAAL=$((TOTAAL+1)); }
          check_fout() { echo "FOUT: $1" >&2; FAIL=1; TOTAAL=$((TOTAAL+1)); }

          # ── 1. Healthcheck (publiek, zonder auth) ──────────────────────────
          echo "--- Check 1: GET /api/healthz ---"
          HEALTH=$(curl -fsS --max-time 15 "${BASE_URL}/api/healthz" 2>/dev/null || echo "")
          HEALTH_STATUS=$(echo "$HEALTH" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).status||'')}catch(e){console.log('')}})" 2>/dev/null || echo "")
          if [ "$HEALTH_STATUS" = "ok" ]; then
            check_ok "healthz geeft status=ok"
          else
            check_fout "/api/healthz: verwacht status=ok, ontvangen: ${HEALTH}"
          fi

          # ── 2. Versie-endpoint (publiek) ───────────────────────────────────
          echo "--- Check 2: GET /api/versie ---"
          VERSIE_RESP=$(curl -fsS --max-time 15 "${BASE_URL}/api/versie" 2>/dev/null || echo "")
          VERSIE_COMMIT=$(echo "$VERSIE_RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).commit||'')}catch(e){console.log('')}})" 2>/dev/null || echo "")
          if [ -n "$VERSIE_COMMIT" ]; then
            check_ok "versie-endpoint geeft commit=${VERSIE_COMMIT}"
          else
            check_fout "/api/versie: commit-veld ontbreekt — ontvangen: ${VERSIE_RESP}"
          fi

          # ── 3. Systeemstatus — databaseverbinding (publiek) ────────────────
          echo "--- Check 3: GET /api/versie/status ---"
          STATUS_RESP=$(curl -fsS --max-time 20 "${BASE_URL}/api/versie/status" 2>/dev/null || echo "")
          DB_STATUS=$(echo "$STATUS_RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).db||'')}catch(e){console.log('')}})" 2>/dev/null || echo "")
          if [ "$DB_STATUS" = "ok" ]; then
            check_ok "systeemstatus: databaseverbinding ok"
          else
            check_fout "/api/versie/status: db=${DB_STATUS} (verwacht ok) — ontvangen: ${STATUS_RESP}"
          fi

          # ── 4. Login met smoketest-account ────────────────────────────────
          echo "--- Check 4: POST /api/auth/login ---"
          LOGIN_BODY=$(node -e "console.log(JSON.stringify({email:process.env.SMOKETEST_EMAIL,wachtwoord:process.env.SMOKETEST_PASSWORD}))" 2>/dev/null)
          LOGIN_HTTP=$(curl -sS --max-time 20 -o /tmp/login-resp.json -w "%{http_code}" \
            -c "$COOKIEJAR" \
            -X POST "${BASE_URL}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "$LOGIN_BODY" 2>/dev/null || echo "000")
          if [ "$LOGIN_HTTP" -eq 200 ]; then
            check_ok "login geeft HTTP 200"
          else
            check_fout "POST /api/auth/login: HTTP ${LOGIN_HTTP} (verwacht 200)"
            cat /tmp/login-resp.json >&2 || true
          fi

          # ── 5. Gebruikerslijst (sessie vereist) ──────────────────────────
          echo "--- Check 5: GET /api/gebruikers ---"
          USERS_HTTP=$(curl -sS --max-time 15 -o /tmp/users-resp.json -w "%{http_code}" \
            -b "$COOKIEJAR" "${BASE_URL}/api/gebruikers" 2>/dev/null || echo "000")
          USERS_COUNT=$(node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const a=JSON.parse(d);console.log(Array.isArray(a)?a.length:0)}catch(e){console.log(0)}})" < /tmp/users-resp.json 2>/dev/null || echo "0")
          if [ "$USERS_HTTP" -eq 200 ] && [ "$USERS_COUNT" -gt 0 ]; then
            check_ok "gebruikerslijst: ${USERS_COUNT} gebruikers"
          else
            check_fout "GET /api/gebruikers: HTTP ${USERS_HTTP}, aantal=${USERS_COUNT}"
          fi

          # ── 6. Dashboard statistieken ─────────────────────────────────────
          echo "--- Check 6: GET /api/dashboard/stats ---"
          STATS_HTTP=$(curl -sS --max-time 15 -o /tmp/stats-resp.json -w "%{http_code}" \
            -b "$COOKIEJAR" "${BASE_URL}/api/dashboard/stats" 2>/dev/null || echo "000")
          if [ "$STATS_HTTP" -eq 200 ]; then
            check_ok "dashboard/stats geeft HTTP 200"
          else
            check_fout "GET /api/dashboard/stats: HTTP ${STATS_HTTP}"
          fi

          # ── 7. Recente activiteit ─────────────────────────────────────────
          echo "--- Check 7: GET /api/dashboard/recente-activiteit ---"
          ACTIV_HTTP=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" \
            -b "$COOKIEJAR" "${BASE_URL}/api/dashboard/recente-activiteit" 2>/dev/null || echo "000")
          if [ "$ACTIV_HTTP" -eq 200 ]; then
            check_ok "recente-activiteit geeft HTTP 200"
          else
            check_fout "GET /api/dashboard/recente-activiteit: HTTP ${ACTIV_HTTP}"
          fi

          # ── 8. Gebouwenlijst ──────────────────────────────────────────────
          echo "--- Check 8: GET /api/gebouwen ---"
          GEBOUW_HTTP=$(curl -sS --max-time 15 -o /tmp/gebouwen-resp.json -w "%{http_code}" \
            -b "$COOKIEJAR" "${BASE_URL}/api/gebouwen" 2>/dev/null || echo "000")
          if [ "$GEBOUW_HTTP" -eq 200 ]; then
            check_ok "gebouwenlijst geeft HTTP 200"
          else
            check_fout "GET /api/gebouwen: HTTP ${GEBOUW_HTTP}"
          fi

          # ── 9. Gebouw aanmaken (smoke-testgebouw) ─────────────────────────
          echo "--- Check 9: POST /api/gebouwen (smoke-testgebouw aanmaken) ---"
          TEST_GEBOUW_ID=""
          CREATE_BODY='{"naam":"__smoketest__","adres":"Teststraat 1","huisnummer":"1","postcode":"1234AB","stad":"Teststad","provincie":"Noord-Holland","land":"Nederland","gebouw_type":"overig"}'
          CREATE_HTTP=$(curl -sS --max-time 20 -o /tmp/create-resp.json -w "%{http_code}" \
            -b "$COOKIEJAR" -c "$COOKIEJAR" \
            -X POST "${BASE_URL}/api/gebouwen" \
            -H "Content-Type: application/json" \
            -d "$CREATE_BODY" 2>/dev/null || echo "000")
          if [ "$CREATE_HTTP" -eq 201 ]; then
            TEST_GEBOUW_ID=$(node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).id||'')}catch(e){console.log('')}})" < /tmp/create-resp.json 2>/dev/null || echo "")
            check_ok "gebouw aanmaken: HTTP 201, id=${TEST_GEBOUW_ID}"
          else
            check_fout "POST /api/gebouwen: HTTP ${CREATE_HTTP} (verwacht 201)"
            cat /tmp/create-resp.json >&2 || true
          fi

          # ── 10. Gebouwdetail ophalen ──────────────────────────────────────
          echo "--- Check 10: GET /api/gebouwen/:id ---"
          if [ -n "$TEST_GEBOUW_ID" ]; then
            DETAIL_HTTP=$(curl -sS --max-time 15 -o /tmp/detail-resp.json -w "%{http_code}" \
              -b "$COOKIEJAR" "${BASE_URL}/api/gebouwen/${TEST_GEBOUW_ID}" 2>/dev/null || echo "000")
            if [ "$DETAIL_HTTP" -eq 200 ]; then
              check_ok "gebouwdetail id=${TEST_GEBOUW_ID} geeft HTTP 200"
            else
              check_fout "GET /api/gebouwen/${TEST_GEBOUW_ID}: HTTP ${DETAIL_HTTP}"
            fi
          else
            echo "OVERGESLAGEN: check 10 (geen testgebouw-id)"
            TOTAAL=$((TOTAAL+1))
          fi

          # ── 11. Gebouw bijwerken ──────────────────────────────────────────
          echo "--- Check 11: PATCH /api/gebouwen/:id ---"
          if [ -n "$TEST_GEBOUW_ID" ]; then
            PATCH_HTTP=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" \
              -b "$COOKIEJAR" \
              -X PATCH "${BASE_URL}/api/gebouwen/${TEST_GEBOUW_ID}" \
              -H "Content-Type: application/json" \
              -d '{"naam":"__smoketest_bijgewerkt__"}' 2>/dev/null || echo "000")
            if [ "$PATCH_HTTP" -eq 200 ]; then
              check_ok "gebouw bijwerken: HTTP 200"
            else
              check_fout "PATCH /api/gebouwen/${TEST_GEBOUW_ID}: HTTP ${PATCH_HTTP}"
            fi
          else
            echo "OVERGESLAGEN: check 11 (geen testgebouw-id)"
            TOTAAL=$((TOTAAL+1))
          fi

          # ── 12. Upload bevestigd na vernieuwen (versie/status tweede keer) ─
          echo "--- Check 12: GET /api/versie/status (tweede meting, consistentiecheck) ---"
          STATUS2_RESP=$(curl -fsS --max-time 20 "${BASE_URL}/api/versie/status" 2>/dev/null || echo "")
          DB2_STATUS=$(echo "$STATUS2_RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).db||'')}catch(e){console.log('')}})" 2>/dev/null || echo "")
          if [ "$DB2_STATUS" = "ok" ]; then
            check_ok "systeemstatus tweede meting: db=ok"
          else
            check_fout "/api/versie/status (tweede): db=${DB2_STATUS}"
          fi

          # ── 13. API en frontend op zelfde commit ──────────────────────────
          echo "--- Check 13: API commit zichtbaar in /api/versie ---"
          if [ -n "$VERSIE_COMMIT" ]; then
            check_ok "commit-hash aanwezig: ${VERSIE_COMMIT}"
          else
            check_fout "/api/versie geeft geen commit-hash terug"
          fi

          # ── 14. Gebouw verwijderen (opruimen testgebouw) ──────────────────
          echo "--- Check 14: DELETE /api/gebouwen/:id (testgebouw opruimen) ---"
          if [ -n "$TEST_GEBOUW_ID" ]; then
            DELETE_HTTP=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" \
              -b "$COOKIEJAR" \
              -X DELETE "${BASE_URL}/api/gebouwen/${TEST_GEBOUW_ID}" 2>/dev/null || echo "000")
            if [ "$DELETE_HTTP" -eq 204 ]; then
              check_ok "gebouw verwijderen: HTTP 204"
            else
              check_fout "DELETE /api/gebouwen/${TEST_GEBOUW_ID}: HTTP ${DELETE_HTTP} (verwacht 204)"
            fi
          else
            echo "OVERGESLAGEN: check 14 (geen testgebouw-id)"
            TOTAAL=$((TOTAAL+1))
          fi

          # ── 15. Sessie na herlaad (laatste API-call met bestaande cookie) ─
          echo "--- Check 15: GET /api/dashboard/stats (sessie-validatie na herlaad) ---"
          SESSION_HTTP=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" \
            -b "$COOKIEJAR" "${BASE_URL}/api/dashboard/stats" 2>/dev/null || echo "000")
          if [ "$SESSION_HTTP" -eq 200 ]; then
            check_ok "sessie nog geldig na meerdere verzoeken: HTTP 200"
          else
            check_fout "Sessie-validatie: GET /api/dashboard/stats gaf HTTP ${SESSION_HTTP}"
          fi

          rm -f "$COOKIEJAR" /tmp/login-resp.json /tmp/users-resp.json \
                /tmp/stats-resp.json /tmp/gebouwen-resp.json \
                /tmp/create-resp.json /tmp/detail-resp.json

          echo ""
          echo "Smoketest resultaat: ${GESLAAGD}/${TOTAAL} checks geslaagd."

          if [ $FAIL -ne 0 ]; then
            echo "SMOKETEST GEFAALD — zie bovenstaande FOUT-regels." >&2
            exit 1
          fi
          echo "Smoketest geslaagd (${GESLAAGD}/${TOTAAL} checks)."
          echo "smoketest|$(date +%s)" >> /tmp/mijlpalen.txt

      # Alleen bij een bewust ingevuld adres tijdens workflow_dispatch. Deze
      # bewijsproef verandert normale deployments niet: hij controleert eerst de
      # niet-verzendende Mail.Send-probe en verstuurt daarna precies één testmail.
      - name: Productie-mailverbinding en echte testmail beproeven
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.test_connect_mail != '' &&
          github.event.inputs.test_faalmail != 'TEST'
        env:
          SMOKETEST_EMAIL_SECRET: ${{ secrets.SMOKETEST_EMAIL }}
          SMOKETEST_PASSWORD_SECRET: ${{ secrets.SMOKETEST_PASSWORD }}
          TEST_CONNECT_MAIL: ${{ github.event.inputs.test_connect_mail }}
        run: |
          set -euo pipefail
          echo "Productie-mailverbinding en echte testmail beproeven" > /tmp/faalstap.txt
          exec > >(tee /tmp/stap-uitvoer.log) 2>&1

          SMOKETEST_EMAIL="${SMOKETEST_EMAIL_SECRET:-${PROEF_SMOKETEST_EMAIL:-}}"
          SMOKETEST_PASSWORD="${SMOKETEST_PASSWORD_SECRET:-${PROEF_SMOKETEST_PASSWORD:-}}"
          export SMOKETEST_EMAIL SMOKETEST_PASSWORD
          if [ -z "${SMOKETEST_EMAIL:-}" ] || [ -z "${SMOKETEST_PASSWORD:-}" ]; then
            echo "SMOKETEST_EMAIL en/of SMOKETEST_PASSWORD ontbreekt; aangevraagde mailproef kan niet draaien." >&2
            exit 1
          fi
          if ! node -e 'process.exit(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(process.env.TEST_CONNECT_MAIL || "") ? 0 : 1)'; then
            echo "test_connect_mail is geen geldig e-mailadres." >&2
            exit 1
          fi

          echo "::add-mask::${TEST_CONNECT_MAIL}"
          BASE_URL="https://connect.fps-one.nl"
          COOKIEJAR=$(mktemp)
          trap 'rm -f "$COOKIEJAR" /tmp/mailproef-login.json /tmp/mailproef-verbinding.json /tmp/mailproef-testmail.json /tmp/mailproef-logboek.json' EXIT

          LOGIN_BODY=$(node -e 'console.log(JSON.stringify({email:process.env.SMOKETEST_EMAIL,wachtwoord:process.env.SMOKETEST_PASSWORD}))')
          LOGIN_HTTP=$(curl -sS --max-time 20 -o /tmp/mailproef-login.json -w "%{http_code}" \
            -c "$COOKIEJAR" \
            -X POST "${BASE_URL}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "$LOGIN_BODY" 2>/dev/null || echo "000")
          if [ "$LOGIN_HTTP" -ne 200 ]; then
            echo "Productie-mailproef: aanmelden gaf HTTP ${LOGIN_HTTP} (verwacht 200)." >&2
            exit 1
          fi

          VERBINDING_HTTP=$(curl -sS --max-time 30 -o /tmp/mailproef-verbinding.json -w "%{http_code}" \
            -b "$COOKIEJAR" \
            -X POST "${BASE_URL}/api/mail/verbindingstest" 2>/dev/null || echo "000")
          if [ "$VERBINDING_HTTP" -ne 200 ] || ! node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/mailproef-verbinding.json","utf8"));process.exit(r.ok===true?0:1)'; then
            echo "Productie-mailproef: verbindingstest niet geslaagd (HTTP ${VERBINDING_HTTP})." >&2
            cat /tmp/mailproef-verbinding.json >&2 || true
            exit 1
          fi
          echo "OK: productieverbindingstest bevestigt token, Mail.Send en postbustoegang."

          TESTMAIL_BODY=$(node -e 'console.log(JSON.stringify({naar_email:process.env.TEST_CONNECT_MAIL}))')
          TESTMAIL_HTTP=$(curl -sS --max-time 30 -o /tmp/mailproef-testmail.json -w "%{http_code}" \
            -b "$COOKIEJAR" \
            -X POST "${BASE_URL}/api/mail/testmail" \
            -H "Content-Type: application/json" \
            -d "$TESTMAIL_BODY" 2>/dev/null || echo "000")
          if [ "$TESTMAIL_HTTP" -ne 200 ] || ! node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/mailproef-testmail.json","utf8"));process.exit(r.ok===true?0:1)'; then
            echo "Productie-mailproef: echte testmail niet door Graph geaccepteerd (HTTP ${TESTMAIL_HTTP})." >&2
            cat /tmp/mailproef-testmail.json >&2 || true
            exit 1
          fi

          LOGBOEK_HTTP=$(curl -sS --max-time 20 -o /tmp/mailproef-logboek.json -w "%{http_code}" \
            -b "$COOKIEJAR" "${BASE_URL}/api/mail/logboek" 2>/dev/null || echo "000")
          if [ "$LOGBOEK_HTTP" -ne 200 ] || ! node -e 'const fs=require("fs");const rows=JSON.parse(fs.readFileSync("/tmp/mailproef-logboek.json","utf8"));const adres=(process.env.TEST_CONNECT_MAIL||"").toLowerCase();process.exit(Array.isArray(rows)&&rows.some(r=>String(r.naar_email||"").toLowerCase()===adres&&r.soort==="test"&&r.status==="verzonden")?0:1)'; then
            echo "Productie-mailproef: geen bijbehorende verzonden-rij in mail_logboek (HTTP ${LOGBOEK_HTTP})." >&2
            exit 1
          fi

          echo "::notice::Productie-mailproef geslaagd: verbinding ok, één echte testmail door Graph geaccepteerd en mail_logboek status=verzonden."

      # ─── OTA-update monteur-app (EAS Update) ───────────────────────────────
      # Na een geslaagde deploy + smoketest wordt de monteur-app automatisch
      # bijgewerkt via EAS Update (kanaal production). Zo krijgen monteurs
      # nooit een verouderde app doordat iemand vergeet handmatig
      # `eas update` te draaien. Native wijzigingen (nieuwe modules,
      # SDK-upgrade) vergen nog steeds een nieuwe APK — zie
      # docs/monteur-app-apk.md.
      # Vereist GitHub Secret: EXPO_TOKEN (Expo access token, account
      # futur-holding). Ontbreekt het token, dan wordt deze stap met een
      # duidelijke waarschuwing overgeslagen; de deploy zelf faalt daar
      # bewust niet op (web/API staan dan al correct live).
      #
      # DEPLOY_SNELHEID_01: de update wordt (1) beperkt tot Android — FPS
      # levert uitsluitend een Android-APK, de iOS-bundel was pure bouwtijd —
      # en (2) alleen gepubliceerd wanneer deze push werkelijk iets aan de
      # telefoon-app wijzigt (artifacts/monteur-app, of de gedeelde pakketten
      # die in de app-bundel belanden: lib/api-client-react en lib/ontwerp).
      # Bij twijfel (handmatige dispatch, force-push, before-commit niet
      # ophaalbaar) draait de update gewoon — overslaan is een optimalisatie,
      # nooit een risico.
      - name: OTA-update monteur-app (EAS Update, kanaal production)
        if: github.event.inputs.test_faalmail != 'TEST'
        id: eas_update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # EXPO_PUBLIC_* wordt bij het exporteren van de update-bundle
          # ingebakken; zonder deze variabele zou de OTA-bundle geen
          # productiedomein hebben (eas.json 'build.env' geldt alleen voor
          # EAS Build, niet voor eas update). Zelfde waarde als het
          # production-buildprofiel.
          EXPO_PUBLIC_DOMAIN: connect.fps-one.nl
          VORIGE_COMMIT: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # ── Alleen draaien als er iets aan de telefoon-app is gewijzigd ──
          APP_PADEN=(artifacts/monteur-app lib/api-client-react lib/ontwerp)
          OTA_NODIG=1
          if [ "${GITHUB_EVENT_NAME}" = "push" ] \
             && [ -n "${VORIGE_COMMIT:-}" ] \
             && [ "${VORIGE_COMMIT}" != "0000000000000000000000000000000000000000" ]; then
            if git fetch --no-tags --depth=1 origin "${VORIGE_COMMIT}" 2>/dev/null; then
              GEWIJZIGD="$(git diff --name-only "${VORIGE_COMMIT}" "${GITHUB_SHA}" -- "${APP_PADEN[@]}" || echo "diff-mislukt")"
              if [ -z "${GEWIJZIGD}" ]; then
                OTA_NODIG=0
              fi
            else
              echo "Vorige commit niet ophaalbaar (force-push?) — OTA-update draait voor de zekerheid gewoon."
            fi
          fi

          if [ "${OTA_NODIG}" -eq 0 ]; then
            echo "Geen wijzigingen aan de telefoon-app in deze uitrol (${APP_PADEN[*]}) — OTA-update overgeslagen."
            echo "ota|$(date +%s)" >> /tmp/mijlpalen.txt
            exit 0
          fi

          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::warning::EXPO_TOKEN ontbreekt als GitHub Actions secret — OTA-update naar monteurs wordt OVERGESLAGEN. Voeg het token toe (Settings -> Secrets -> Actions) of draai handmatig: cd artifacts/monteur-app && npx eas-cli update --channel production --platform android."
            echo "ota|$(date +%s)" >> /tmp/mijlpalen.txt
            exit 0
          fi

          COMMIT_KORT="${GITHUB_SHA:0:7}"
          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "onbekend")

          cd artifacts/monteur-app
          npx eas-cli update \
            --channel production \
            --platform android \
            --non-interactive \
            --message "deploy ${COMMIT_KORT}: ${COMMIT_MSG}"

          echo "OTA-update gepubliceerd op kanaal production (alleen Android, commit ${COMMIT_KORT})."
          echo "ota|$(date +%s)" >> /tmp/mijlpalen.txt

      # ─── Tijd- en schijfbewaking (DEPLOY_SNELHEID_01 punt 4 + 5) ────────────
      # Draait alleen bij een verder geslaagde uitrol (bij falen mailt de
      # faalmelding-stap hieronder al). Twee bewakingen, één mail via exact
      # dezelfde Microsoft 365/Graph-koppeling:
      #  - tijdbewaking is ADAPTIEF (geen vaste grens meer — die van 8 minuten
      #    werd bij vrijwel elke uitrol overschreden en produceerde identieke
      #    mails): melden alleen bij een VERSLECHTERING, d.w.z. wanneer deze
      #    uitrol meer dan de helft langer duurt dan de mediaan van de laatste
      #    tien geslaagde uitrollen (via de GitHub API), en hoogstens één
      #    tijdmelding per dag (datummarker op de VPS);
      #  - meldde het deployscript SCHIJF_ALARM (schijf na opruimen nog boven
      #    85%) → dezelfde mail, ongewijzigd en zonder dagelijkse beperking.
      - name: Tijd- en schijfbewaking (mail bij trage uitrol of volle schijf)
        if: success() && github.event.inputs.test_faalmail != 'TEST'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || 'noreply@fpsbrandpreventie.nl' }}
          MAIL_MAILBOX: ${{ secrets.MAIL_MAILBOX || 'app@fpsbrandpreventie.nl' }}
          RENE_EMAIL: ${{ secrets.RENE_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
        run: |
          set -euo pipefail

          NU=$(date +%s)
          DUUR=$((NU - DEPLOY_START))

          # Mediaan van de laatste tien geslaagde uitrollen (deze run niet
          # meegeteld) uit de GitHub API. Bij minder dan drie historische
          # runs is er geen zinvolle basislijn — dan geen tijdmelding.
          MEDIAAN="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?status=success&per_page=15" \
            | node -e '
              let d = "";
              process.stdin.on("data", (c) => (d += c));
              process.stdin.on("end", () => {
                try {
                  const runs = (JSON.parse(d).workflow_runs || [])
                    .filter((r) => String(r.id) !== process.env.GITHUB_RUN_ID)
                    .slice(0, 10);
                  const duren = runs
                    .map((r) => (new Date(r.updated_at) - new Date(r.run_started_at)) / 1000)
                    .filter((s) => Number.isFinite(s) && s > 0)
                    .sort((a, b) => a - b);
                  if (duren.length < 3) return console.log("");
                  const m = duren.length % 2
                    ? duren[(duren.length - 1) / 2]
                    : (duren[duren.length / 2 - 1] + duren[duren.length / 2]) / 2;
                  console.log(Math.round(m));
                } catch { console.log(""); }
              });' || echo "")"

          TE_TRAAG=0
          if [ -n "${MEDIAAN}" ]; then
            GRENS=$((MEDIAAN * 3 / 2))
            echo "Totale uitrolduur: ${DUUR}s (mediaan laatste 10: ${MEDIAAN}s, meldgrens: >${GRENS}s)."
            [ "${DUUR}" -gt "${GRENS}" ] && TE_TRAAG=1
          else
            echo "Totale uitrolduur: ${DUUR}s (geen basislijn van eerdere uitrollen beschikbaar — geen tijdmelding)."
          fi

          # Schijfalarm uit de deploy-uitvoer (marker gezet door het script
          # op de VPS wanneer de schijf ook ná opruimen boven de 85% staat).
          SCHIJF_ALARM="$( (grep -E '^SCHIJF_ALARM\|' /tmp/deploy-output.log 2>/dev/null || true) | head -1 | cut -d'|' -f2)"

          # Hoogstens één tijdmelding per dag: datummarker op de VPS (de
          # runner zelf is wegwerp). Het schijfalarm valt hier bewust buiten.
          if [ "${TE_TRAAG}" -eq 1 ]; then
            VANDAAG="$(date -u +%F)"
            LAATSTE_MAIL_DATUM="$(ssh -i ~/.ssh/deploy_key -p "${PROD_SSH_PORT}" \
              "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
              'cat /opt/fps-one/.deploy-tijdmelding-datum 2>/dev/null' || true)"
            if [ "${LAATSTE_MAIL_DATUM}" = "${VANDAAG}" ]; then
              echo "Uitrol trager dan de meldgrens (${DUUR}s), maar vandaag is al een tijdmelding verstuurd — geen tweede mail."
              TE_TRAAG=0
            fi
          fi

          if [ "${TE_TRAAG}" -eq 0 ] && [ -z "${SCHIJF_ALARM}" ]; then
            echo "Geen verslechtering en schijf onder de grens — geen mail."
            exit 0
          fi

          # Duur per workflow-fase uit de mijlpalen (opeenvolgende verschillen).
          FASE_TIJDEN="$(awk -F'|' 'NR>1 {printf "  %s: %ds\n", $1, $2 - vorig} {vorig=$2}' /tmp/mijlpalen.txt 2>/dev/null || echo "  (geen mijlpalen beschikbaar)")"
          # Duur per serverstap uit de deploy-uitvoer (TIJD|stap|Ns).
          SERVER_TIJDEN="$( (grep -E '^TIJD\|' /tmp/deploy-output.log 2>/dev/null || true) | awk -F'|' '{printf "  %s: %s\n", $2, $3}')"
          [ -n "${SERVER_TIJDEN}" ] || SERVER_TIJDEN="  (geen serverstap-tijden gevonden in de deploy-uitvoer)"

          REDENEN=""
          [ "${TE_TRAAG}" -eq 1 ] && REDENEN="- Uitrol duurde ${DUUR}s — meer dan de helft langer dan de mediaan van de laatste tien uitrollen (${MEDIAAN}s, meldgrens >${GRENS}s)."$'\n'
          [ -n "${SCHIJF_ALARM}" ] && REDENEN="${REDENEN}- Schijf op de server staat ook na het opruimen van oude Docker-images op ${SCHIJF_ALARM}% (grens: 85%)."$'\n'

          if [ -z "${AZURE_TENANT_ID:-}" ] || [ -z "${AZURE_CLIENT_ID:-}" ] || [ -z "${AZURE_CLIENT_SECRET:-}" ] || [ -z "${RENE_EMAIL:-}" ]; then
            echo "Mailconfig ontbreekt als GitHub Actions secret; bewakingsmelding kan niet verzonden worden. Redenen die gemeld zouden zijn:" >&2
            printf '%s' "${REDENEN}" >&2
            exit 0
          fi

          HTTP_TOKEN_CODE=$(curl -sS -o /tmp/token-resp.json -w "%{http_code}" -X POST \
            "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
            -d "client_id=${AZURE_CLIENT_ID}" \
            -d "client_secret=${AZURE_CLIENT_SECRET}" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "grant_type=client_credentials" || echo "000")
          TOKEN=$(node -e "try{const d=require('fs').readFileSync('/tmp/token-resp.json','utf8');console.log(JSON.parse(d).access_token||'')}catch(e){console.log('')}" 2>/dev/null || echo "")

          if [ -z "$TOKEN" ]; then
            echo "Kon geen Graph-token ophalen (HTTP ${HTTP_TOKEN_CODE}); bewakingsmelding kan niet verzonden worden." >&2
            echo "Azure-antwoord:" >&2
            cat /tmp/token-resp.json >&2 || true
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "onbekend")
          BODY="Productie-release GESLAAGD, maar de deploybewaking sloeg aan.

          Commit: ${GITHUB_SHA}
          Omschrijving: ${COMMIT_MSG}
          Totale uitrolduur: ${DUUR}s

          Redenen:
          ${REDENEN}
          Duur per workflow-fase:
          ${FASE_TIJDEN}

          Duur per serverstap (deployscript op de VPS):
          ${SERVER_TIJDEN}

          Actions-run: ${RUN_URL}"

          PAYLOAD=$(MAIL_BODY="$BODY" node -e "
            const body = {
              message: {
                subject: 'FPS Connect: deploybewaking — uitrol traag of schijf vol',
                body: { contentType: 'Text', content: process.env.MAIL_BODY.replace(/^ {10}/gm, '') },
                toRecipients: [{ emailAddress: { address: process.env.RENE_EMAIL } }],
                from: { emailAddress: { address: process.env.MAIL_FROM, name: 'FPS Connect' } },
              },
              saveToSentItems: false,
            };
            console.log(JSON.stringify(body));
          ")

          HTTP_CODE=$(curl -sS -o /tmp/graph-response.json -w "%{http_code}" \
            -X POST "https://graph.microsoft.com/v1.0/users/${MAIL_MAILBOX}/sendMail" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Bewakingsmelding verzonden naar René."
            # Datummarker bijwerken zodat een volgende trage uitrol vandaag
            # geen tweede tijdmelding meer oplevert.
            if [ "${TE_TRAAG}" -eq 1 ]; then
              ssh -i ~/.ssh/deploy_key -p "${PROD_SSH_PORT}" \
                "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
                "printf '%s' '$(date -u +%F)' > /opt/fps-one/.deploy-tijdmelding-datum" \
                || echo "WAARSCHUWING: datummarker op de VPS kon niet worden bijgewerkt." >&2
            fi
          else
            echo "Verzenden van bewakingsmelding gaf HTTP $HTTP_CODE." >&2
            cat /tmp/graph-response.json >&2 || true
            exit 0
          fi

      # ─── Meldingen bij falen ────────────────────────────────────────────────
      # René moet een kapotte release direct horen, niet later ontdekken via de
      # Actions-tab. Verstuurt via dezelfde Microsoft 365/Graph-mailkoppeling
      # als de app zelf (client-credentials, geen wachtwoord). Bij een
      # geslaagde deploy géén melding (voorkomt mailmoeheid).
      - name: Faalmelding e-mailen naar René
        if: >-
          failure() ||
          (github.event_name == 'workflow_dispatch' &&
           github.event.inputs.test_faalmail == 'TEST')
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || 'noreply@fpsbrandpreventie.nl' }}
          MAIL_MAILBOX: ${{ secrets.MAIL_MAILBOX || 'app@fpsbrandpreventie.nl' }}
          RENE_EMAIL: ${{ secrets.RENE_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IS_FAALMAIL_TEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_faalmail == 'TEST' }}
        run: |
          set -euo pipefail

          if [ -z "${AZURE_TENANT_ID:-}" ] || [ -z "${AZURE_CLIENT_ID:-}" ] || [ -z "${AZURE_CLIENT_SECRET:-}" ] || [ -z "${RENE_EMAIL:-}" ]; then
            echo "Mailconfig (AZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET/RENE_ALERT_EMAIL) ontbreekt als GitHub Actions secret; faalmelding kan niet verzonden worden." >&2
            exit 0
          fi

          HTTP_TOKEN_CODE=$(curl -sS -o /tmp/token-resp.json -w "%{http_code}" -X POST \
            "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
            -d "client_id=${AZURE_CLIENT_ID}" \
            -d "client_secret=${AZURE_CLIENT_SECRET}" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "grant_type=client_credentials" || echo "000")
          TOKEN=$(node -e "try{const d=require('fs').readFileSync('/tmp/token-resp.json','utf8');console.log(JSON.parse(d).access_token||'')}catch(e){console.log('')}" 2>/dev/null || echo "")

          if [ -z "$TOKEN" ]; then
            echo "Kon geen Graph-token ophalen (HTTP ${HTTP_TOKEN_CODE}); faalmelding kan niet verzonden worden." >&2
            echo "Azure-antwoord:" >&2
            cat /tmp/token-resp.json >&2 || true
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "onbekend")

          # Welke stap faalde? Elke kritieke stap schrijft zijn naam naar
          # /tmp/faalstap.txt vóór hij begint; de laatste inhoud is dus de
          # stap die brak. Smoketest-uitkomst blijft apart benoemd.
          FAAL_STAP=$(cat /tmp/faalstap.txt 2>/dev/null || echo "onbekende stap (vóór de eerste controle)")
          SMOKETEST_OK="${{ steps.smoketest.outcome }}"
          if [ "${IS_FAALMAIL_TEST}" = "true" ]; then
            REDEN="Bewuste testfout: de faalmelding wordt end-to-end beproefd."
          elif [ "$SMOKETEST_OK" = "failure" ]; then
            REDEN="Post-deploy smoketest gefaald: de site op connect.fps-one.nl reageert niet correct."
          else
            REDEN="Stap '${FAAL_STAP}' is gefaald."
          fi

          # Laatste uitvoerregels van de gefaalde stap (indien vastgelegd).
          UITVOER_STAART=$(tail -n 15 /tmp/stap-uitvoer.log 2>/dev/null || echo "(geen uitvoer vastgelegd)")
          [ -n "$UITVOER_STAART" ] || UITVOER_STAART="(geen uitvoer vastgelegd)"

          # Prodstatus in één zin: is de server al aangeraakt of niet?
          if [ "${PROD_AANGERAAKT:-0}" = "1" ]; then
            PROD_STATUS="Let op: de productieserver was al aangeraakt toen de fout optrad — controleer of connect.fps-one.nl nog goed draait."
          else
            PROD_STATUS="De fout trad op vóórdat de productieserver werd aangeraakt — productie draait ongewijzigd door."
          fi

          BODY=$(cat <<EOF
          Productie-release GEFAALD.

          Commit: ${GITHUB_SHA}
          Omschrijving: ${COMMIT_MSG}
          Gefaalde stap: ${FAAL_STAP}
          Reden: ${REDEN}
          ${PROD_STATUS}

          Laatste uitvoer van de gefaalde stap:
          ------------------------------------
          ${UITVOER_STAART}
          ------------------------------------

          Actions-run: ${RUN_URL}

          Controleer de run-logs en de productiestatus zo snel mogelijk.
          EOF
          )

          PAYLOAD=$(MAIL_BODY="$BODY" node -e "
            const body = {
              message: {
                subject: 'FPS Connect: productie-release GEFAALD',
                body: { contentType: 'Text', content: process.env.MAIL_BODY },
                toRecipients: [{ emailAddress: { address: process.env.RENE_EMAIL } }],
                from: { emailAddress: { address: process.env.MAIL_FROM, name: 'FPS Connect' } },
              },
              saveToSentItems: false,
            };
            console.log(JSON.stringify(body));
          ")

          HTTP_CODE=$(curl -sS -o /tmp/graph-response.json -w "%{http_code}" \
            -X POST "https://graph.microsoft.com/v1.0/users/${MAIL_MAILBOX}/sendMail" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Faalmelding verzonden naar René."
          else
            echo "Verzenden van faalmelding gaf HTTP $HTTP_CODE." >&2
            cat /tmp/graph-response.json >&2 || true
            exit 0
          fi

      # ─── UITROL_BEWAKING_01: uitrol terugmelden aan Connect ─────────────────
      # Na élke run (geslaagd of gefaald) meldt de runner aan de draaiende app
      # welke commit uitgerold had moeten zijn, plus de falende stap. Connect
      # vergelijkt dat met zijn eigen versie en opent/sluit automatisch een
      # actiepunt in de werkbak van de hoofdbeheerder. Nooit fataal: bewaking
      # mag een deploy niet breken.
      - name: Uitrol terugmelden aan Connect
        if: >-
          always() &&
          !(github.event_name == 'workflow_dispatch' &&
            github.event.inputs.test_faalmail == 'TEST')
        env:
          UITROL_RAPPORT_SLEUTEL: ${{ secrets.UITROL_RAPPORT_SLEUTEL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_URL: https://connect.fps-one.nl
        run: |
          set -euo pipefail
          if [ -z "${UITROL_RAPPORT_SLEUTEL:-}" ]; then
            echo "UITROL_RAPPORT_SLEUTEL ontbreekt als GitHub Actions secret; terugmelding wordt overgeslagen." >&2
            exit 0
          fi
          if [ "${JOB_STATUS}" = "cancelled" ]; then
            echo "Run geannuleerd (ingehaald door nieuwere push); geen terugmelding nodig."
            exit 0
          fi
          CONCLUSIE="failure"
          [ "${JOB_STATUS}" = "success" ] && CONCLUSIE="success"
          FALENDE_STAP=""
          if [ "$CONCLUSIE" = "failure" ]; then
            if [ -f /tmp/faalstap.txt ]; then
              FALENDE_STAP="$(head -c 300 /tmp/faalstap.txt | tr -d '\n' || true)"
            else
              # Faalde er iets vóór de eerste run-stap (checkout/action-setup),
              # dan bestaat de marker nog niet — eerlijk melden i.p.v. gokken.
              FALENDE_STAP="onbekend (vroege voorbereidingsstap: checkout/setup)"
            fi
          fi
          BODY=$(CONCLUSIE="$CONCLUSIE" FALENDE_STAP="$FALENDE_STAP" node -e "
            console.log(JSON.stringify({
              commit: process.env.GITHUB_SHA,
              conclusie: process.env.CONCLUSIE,
              falende_stap: process.env.FALENDE_STAP || null,
              run_url: process.env.RUN_URL,
              run_id: Number(process.env.GITHUB_RUN_ID) || null,
            }));
          ")
          HTTP_CODE=$(curl -sS -o /tmp/uitrol-rapport-resp.json -w "%{http_code}" --max-time 20 \
            -X POST "${BASE_URL}/api/uitrol/rapport" \
            -H "Content-Type: application/json" \
            -H "X-Uitrol-Sleutel: ${UITROL_RAPPORT_SLEUTEL}" \
            -d "$BODY" || echo "000")
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Uitrol teruggemeld aan Connect (conclusie=${CONCLUSIE})."
          else
            echo "Terugmelden gaf HTTP ${HTTP_CODE} (niet fataal; de bewakingsloop mist dan één meting)." >&2
            cat /tmp/uitrol-rapport-resp.json >&2 || true
            exit 0
          fi
