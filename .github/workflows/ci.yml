name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck & build
    runs-on: ubuntu-latest
    # Productie draait op PostgreSQL 16-alpine
    # (deploy/docker-compose.production.yml). Deze database bestaat uitsluitend
    # gedurende deze CI-run en dekt ook de echte aanvraag-integratieproeven.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fps_ci_typecheck
          POSTGRES_PASSWORD: fps_ci_typecheck_alleen_deze_run
          POSTGRES_DB: fps_ci_typecheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fps_ci_typecheck -d fps_ci_typecheck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://fps_ci_typecheck:fps_ci_typecheck_alleen_deze_run@127.0.0.1:5432/fps_ci_typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # CI_SIGNAAL_01: elke stap schrijft eerst zijn naam naar /tmp/faalstap.txt
      # zodat de terugmelding onderaan bij rood de gefaalde taak kan noemen.
      - name: Installeer dependencies
        run: |
          echo "Installeer dependencies" > /tmp/faalstap.txt
          pnpm install --frozen-lockfile

      # SCHEMA_01: migrate.mjs verwacht het historische nulpunt en voert daarna
      # uitsluitend de genummerde migratieketen uit. Wacht daarnaast expliciet
      # op verbindingen; een groene container-start is geen databasebewijs.
      - name: Bereid tijdelijke integratiedatabase voor
        run: |
          set -euo pipefail
          echo "Bereid tijdelijke integratiedatabase voor" > /tmp/faalstap.txt
          for _ in $(seq 1 60); do
            if pg_isready -d "${DATABASE_URL}" >/dev/null; then
              break
            fi
            sleep 1
          done
          pg_isready -d "${DATABASE_URL}"
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -q -f lib/db/schema.sql
          pnpm --filter @workspace/scripts run seed-profielen
          pnpm --filter @workspace/db run migrate
          pnpm --filter @workspace/db run smoketest-account
        env:
          SMOKETEST_PASSWORD: aanvraag-ci-smoketest-alleen-deze-run

      - name: Typecheck alle packages
        run: |
          echo "Typecheck alle packages" > /tmp/faalstap.txt
          pnpm run typecheck

      # SIGNALEN_LINKS_01 — voorkomt dat bekende directiesignalen hun doelpad
      # verliezen of dat de FIE-route actievelden uit het OpenAPI-contract filtert.
      - name: Directiesignalen-doorklikcontrole
        run: |
          echo "Directiesignalen-doorklikcontrole" > /tmp/faalstap.txt
          pnpm --filter @workspace/api-server run test:signaal-links

      # HERSTEL_01: dubbele methode+pad-declaraties = stille dode code (Express
      # neemt de eerste); vandaag twee keer ontstaan bij merges.
      - name: Dubbele-routes-controle
        run: |
          echo "Dubbele-routes-controle" > /tmp/faalstap.txt
          pnpm --filter @workspace/scripts run check-dubbele-routes

      # KLANTLOOS_01 fase 3: faalt zodra de klantrol of een "of klant"-
      # autorisatievariant terugkeert in Connect.
      - name: Klantloos-controle
        run: |
          echo "Klantloos-controle" > /tmp/faalstap.txt
          pnpm --filter @workspace/scripts run klantloos-check

      # REGISTER_01: de 213-puntsinventaris, vaste bewijskrachtvolgorde,
      # scriptkoppelingen en stale-bewijsinvariant mogen niet stil terugvallen.
      - name: Acceptatieregister-hergradingcontrole
        run: |
          echo "Acceptatieregister-hergradingcontrole" > /tmp/faalstap.txt
          pnpm --filter @workspace/scripts run controle-acceptatieregister-hergrading

      # SESSIE_01: verbiedt session["gebruikerId"] (het veld heet userId) en
      # session["naam"]/session["gebruikerNaam"] (bestaan niet in SessionData).
      # Vangt de stille autorisatie-breuk die in aug 2026 in 8+ routes zat.
      - name: Sessieveld-antipatroon-controle
        run: |
          echo "Sessieveld-antipatroon-controle" > /tmp/faalstap.txt
          pnpm --filter @workspace/api-server run check-sessie-velden

      - name: Build api-server
        run: |
          echo "Build api-server" > /tmp/faalstap.txt
          pnpm --filter @workspace/api-server run build

      - name: Build firevault (frontend)
        run: |
          echo "Build firevault (frontend)" > /tmp/faalstap.txt
          PORT=3000 BASE_PATH=/ pnpm --filter @workspace/firevault run build
        env:
          NODE_ENV: production

      # SCHEMA_01 — blokkeer een merge als een migratiebestand is hernoemd of
      # verwijderd t.o.v. main. Hernoemde bestanden laten verweesd registraties
      # achter in prod-schema_migraties en blokkeren elke volgende deploy.
      # Zie docs/schema-migratieketen.md §Bewaker.
      - name: Migratie-hernoeming-controle
        run: |
          echo "Migratie-hernoeming-controle" > /tmp/faalstap.txt
          git fetch origin main --depth=1
          pnpm --filter @workspace/db run check-hernoeming

      # CONTRACT_01 — bewakingstests voor aanzegdatums en DBA-grens draaien bij
      # elke PR zodat een falende berekening niet ongemerkt wordt gemerged.
      - name: Contract-bewaking unit-tests
        run: |
          echo "Contract-bewaking unit-tests" > /tmp/faalstap.txt
          pnpm test
        env:
          AANVRAAG_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          PROJECTLEIDER_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      # CI_SIGNAAL_01 — meld de conclusie van deze run terug aan Connect zodat
      # een rode bouwcontrole op main automatisch een actiepunt bij de
      # hoofdbeheerder opent (en groen het weer sluit). Alleen op main-pushes;
      # nooit fataal voor de run zelf. Zelfde gedeelde sleutel als de
      # deploy-terugmelding (UITROL_RAPPORT_SLEUTEL).
      - name: Terugmelding aan Connect (alleen main)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          UITROL_RAPPORT_SLEUTEL: ${{ secrets.UITROL_RAPPORT_SLEUTEL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_URL: https://connect.fps-one.nl
        run: |
          set -euo pipefail
          if [ -z "${UITROL_RAPPORT_SLEUTEL:-}" ]; then
            echo "UITROL_RAPPORT_SLEUTEL ontbreekt als GitHub Actions secret; terugmelding wordt overgeslagen." >&2
            exit 0
          fi
          if [ "${JOB_STATUS}" = "cancelled" ]; then
            echo "Run geannuleerd (ingehaald door nieuwere push); geen terugmelding nodig."
            exit 0
          fi
          CONCLUSIE="failure"
          [ "${JOB_STATUS}" = "success" ] && CONCLUSIE="success"
          GEFAALDE_TAAK=""
          if [ "$CONCLUSIE" = "failure" ]; then
            if [ -f /tmp/faalstap.txt ]; then
              GEFAALDE_TAAK="Typecheck & build — $(head -c 250 /tmp/faalstap.txt | tr -d '\n' || true)"
            else
              GEFAALDE_TAAK="Typecheck & build — onbekend (vroege voorbereidingsstap: checkout/setup)"
            fi
          fi
          BODY=$(CONCLUSIE="$CONCLUSIE" GEFAALDE_TAAK="$GEFAALDE_TAAK" node -e "
            console.log(JSON.stringify({
              commit: process.env.GITHUB_SHA,
              conclusie: process.env.CONCLUSIE,
              gefaalde_taak: process.env.GEFAALDE_TAAK || null,
              run_url: process.env.RUN_URL,
              run_id: Number(process.env.GITHUB_RUN_ID) || null,
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT) || null,
            }));
          ")
          HTTP_CODE=$(curl -sS -o /tmp/ci-rapport-resp.json -w "%{http_code}" --max-time 20 \
            -X POST "${BASE_URL}/api/ci/rapport" \
            -H "Content-Type: application/json" \
            -H "X-Uitrol-Sleutel: ${UITROL_RAPPORT_SLEUTEL}" \
            -d "$BODY" || echo "000")
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "CI-conclusie teruggemeld aan Connect (conclusie=${CONCLUSIE})."
          else
            echo "Terugmelden gaf HTTP ${HTTP_CODE} (niet fataal; de bewakingsloop mist dan één meting)." >&2
            cat /tmp/ci-rapport-resp.json >&2 || true
            exit 0
          fi

  acceptatieregister-integratie:
    name: Acceptatieregister DB/API-keten
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fps_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fps_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fps_ci
      SESSION_SECRET: register-ci-session-secret-minstens-32-tekens
      API_BASIS: http://127.0.0.1:8080/api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migreer en vul wegwerpregister
        run: |
          set -euo pipefail
          # migrate.mjs stempelt de historische basislijn alleen als die
          # aantoonbaar aanwezig is. Deze CI-database is bewust leeg, dus laad
          # eerst het vaste SCHEMA_01-nulpunt en de echte profielpresets waarop
          # migratie 0105 fail-closed controleert. Pas daarna de keten toe.
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -q -f lib/db/schema.sql
          pnpm --filter @workspace/scripts run seed-profielen
          pnpm --filter @workspace/db run migrate
          pnpm --filter @workspace/api-server run test:ci-rood-mail-claim
          pnpm --filter @workspace/api-server exec tsx src/scripts/verificatie-loonfundament.ts
          pnpm --filter @workspace/scripts exec tsx src/vul-acceptatieregister.ts
          pnpm --filter @workspace/scripts exec tsx src/vul-register01-punten.ts
          if NODE_ENV=test \
            ACCEPTATIEREGISTER_HERGRADEER_PRODUCTIE=1 \
            ACCEPTATIEREGISTER_HERGRADEER_TEST_FAAL_NA=1 \
            pnpm --filter @workspace/scripts exec tsx src/herbeoordeel-acceptatieregister.ts \
            --eenmalig-productie --geen-rapportbestand; then
            echo "Hergradeertest had gecontroleerd moeten falen"
            exit 1
          fi
      - name: Bouw API en bewijs echte registerketen
        run: |
          set -euo pipefail
          pnpm --filter @workspace/api-server run build
          PORT=8080 NODE_ENV=test pnpm --filter @workspace/api-server run start >/tmp/register-api.log 2>&1 &
          API_PID=$!
          trap 'kill ${API_PID} 2>/dev/null || true; cat /tmp/register-api.log' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/healthz >/dev/null
          # V6 controleert een daadwerkelijk door de bestaande generator
          # geschreven rapport. Genereer de beginstand vóór de verificatie;
          # na V7 wordt het rapport hieronder opnieuw uit de eindstand gemaakt.
          pnpm --filter @workspace/scripts exec tsx src/genereer-statusrapport.ts
          pnpm --filter @workspace/scripts run verificatie-register01
          pnpm --filter @workspace/scripts exec tsx src/genereer-statusrapport.ts
          TWEEDE_RUN="$(
            ACCEPTATIEREGISTER_HERGRADEER_PRODUCTIE=1 \
              pnpm --filter @workspace/scripts exec tsx src/herbeoordeel-acceptatieregister.ts \
              --eenmalig-productie --geen-rapportbestand
          )"
          printf '%s\n' "${TWEEDE_RUN}"
          printf '%s\n' "${TWEEDE_RUN}" | grep -q '"modus": "overgeslagen"'
