name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installeer dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck alle packages
        run: pnpm run typecheck

      # KLANT_01 — blokkeer de build als een route requireBevoegdheidOfKlant
      # gebruikt zonder bewuste opname in KLANT_TOEGESTANE_ROUTES.
      # Statische check bewaakt de afspraak; de runtime klant-poort blijft de garantie.
      - name: Klant-poort allowlist-controle
        run: pnpm --filter @workspace/scripts run klant-poort-check

      - name: Build api-server
        run: pnpm --filter @workspace/api-server run build

      - name: Build firevault (frontend)
        run: PORT=3000 BASE_PATH=/ pnpm --filter @workspace/firevault run build
        env:
          NODE_ENV: production
