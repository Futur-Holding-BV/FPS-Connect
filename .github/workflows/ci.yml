name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installeer dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck alle packages
        run: pnpm run typecheck

      # HERSTEL_01: dubbele methode+pad-declaraties = stille dode code (Express
      # neemt de eerste); vandaag twee keer ontstaan bij merges.
      - name: Dubbele-routes-controle
        run: pnpm --filter @workspace/scripts run check-dubbele-routes

      - name: Build api-server
        run: pnpm --filter @workspace/api-server run build

      - name: Build firevault (frontend)
        run: PORT=3000 BASE_PATH=/ pnpm --filter @workspace/firevault run build
        env:
          NODE_ENV: production

      # SCHEMA_01 — blokkeer een merge als een migratiebestand is hernoemd of
      # verwijderd t.o.v. main. Hernoemde bestanden laten verweesd registraties
      # achter in prod-schema_migraties en blokkeren elke volgende deploy.
      # Zie docs/schema-migratieketen.md §Bewaker.
      - name: Migratie-hernoeming-controle
        run: |
          git fetch origin main --depth=1
          pnpm --filter @workspace/db run check-hernoeming
