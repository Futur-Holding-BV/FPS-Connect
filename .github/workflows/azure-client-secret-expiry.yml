name: Azure client-secret vervaldatum

# Controleer vóór het secret stilletjes verloopt. De eerste dag van elke maand
# is voldoende voor de 30-dagenwaarschuwing; workflow_dispatch is beschikbaar
# om na een secret-rotatie direct te controleren.
on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-azure-secret:
    name: Controleer alle Azure client-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Repository uitchecken
        uses: actions/checkout@v4

      - name: Vervaldatums ophalen via Microsoft Graph
        id: check
        continue-on-error: true
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set +e
          node scripts/check-azure-client-secret.mjs > /tmp/azure-secret-check.json
          CHECK_EXIT=$?
          set -e
          cat /tmp/azure-secret-check.json
          echo "exit=${CHECK_EXIT}" >> "$GITHUB_OUTPUT"

      - name: Waarschuwen of herstellen via GitHub-issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || 'noreply@fpsbrandpreventie.nl' }}
          MAIL_MAILBOX: ${{ secrets.MAIL_MAILBOX || 'app@fpsbrandpreventie.nl' }}
          RENE_EMAIL: ${{ secrets.RENE_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          RESULT_FILE=/tmp/azure-secret-check.json
          if [ ! -s "$RESULT_FILE" ]; then
            RESULT='{"ok":false,"warning":false,"message":"De Graph-controle leverde geen resultaat op."}'
          else
            RESULT="$(cat "$RESULT_FILE")"
          fi

          OK=$(RESULT="$RESULT" node -e "const r=JSON.parse(process.env.RESULT); console.log(r.ok ? 'ja' : 'nee')")
          WARNING=$(RESULT="$RESULT" node -e "const r=JSON.parse(process.env.RESULT); console.log(r.warning ? 'ja' : 'nee')")
          MESSAGE=$(RESULT="$RESULT" node -e "const r=JSON.parse(process.env.RESULT); console.log(r.message || 'onbekende uitkomst')")
          WARNING_DAYS=$(RESULT="$RESULT" node -e "const r=JSON.parse(process.env.RESULT); console.log(r.warningDays || 30)")
          echo "Controle: ${MESSAGE}"

          maak_issue() {
            local title="$1"
            local body="$2"
            local issues_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/issues"
            local existing number payload response

            if [ -z "${GH_TOKEN:-}" ]; then
              echo "::error title=Azure client-secretcontrole::GitHub-token ontbreekt; issue-fallback kon niet worden gemaakt."
              return 1
            fi

            existing=$(curl -fsS --max-time 20 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${issues_url}?state=open&per_page=100" || true)
            number=$(TITLE="$title" ISSUES="$existing" node -e "
              const title = process.env.TITLE;
              let issues = [];
              try { issues = JSON.parse(process.env.ISSUES || '[]'); } catch {}
              const issue = issues.find((item) => !item.pull_request && item.title === title);
              console.log(issue?.number || '');
            ")
            payload=$(TITLE="$title" BODY="$body" node -e \
              "console.log(JSON.stringify({title:process.env.TITLE,body:process.env.BODY}))")

            if [ -n "$number" ]; then
              response=$(curl -fsS --max-time 20 -X PATCH \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                "${issues_url}/${number}" -d "$payload" || true)
              if [ -z "$response" ]; then
                echo "::error title=Azure client-secretcontrole::Bestaand GitHub-issue kon niet worden bijgewerkt."
                return 1
              fi
              echo "Bestaand GitHub-issue #${number} bijgewerkt als fallback."
            else
              response=$(curl -fsS --max-time 20 -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                "$issues_url" -d "$payload" || true)
              if [ -z "$response" ]; then
                echo "::error title=Azure client-secretcontrole::GitHub-issue kon niet worden aangemaakt."
                return 1
              fi
              echo "GitHub-issue aangemaakt als fallback."
            fi
          }

          details() {
            RESULT="$RESULT" node -e "
              const r = JSON.parse(process.env.RESULT);
              for (const item of (r.expiring || [])) {
                console.log('- ' + item.displayName + ': ' + item.endDateTime + ' (' + item.daysLeft + ' dagen)');
              }
            "
          }

          if [ "$OK" = "ja" ] && [ "$WARNING" = "nee" ]; then
            echo "Geen waarschuwing nodig; alle client-secrets zijn buiten de ${WARNING_DAYS} dagen-drempel."
            exit 0
          fi

          if [ "$OK" != "ja" ]; then
            SUBJECT="Azure client-secretcontrole mislukt"
            echo "::error title=${SUBJECT}::${MESSAGE}"
            BODY=$(cat <<EOF
          De maandelijkse controle van het Azure client-secret kon niet vaststellen of alle secrets geldig zijn.

          Vastgestelde melding: ${MESSAGE}
          Workflow-run: ${RUN_URL}

          Controleer de GitHub Actions-secrets en de Microsoft Graph Application.Read.All-machtiging.
          EOF
          )
            maak_issue "$SUBJECT" "$BODY" || true
            exit 1
          fi

          EXPIRING_DETAILS=$(details)
          SUBJECT="Azure client-secret verloopt binnenkort"
          BODY=$(cat <<EOF
          De maandelijkse controle heeft één of meer Azure client-secrets gevonden die binnen 30 dagen verlopen of al verlopen zijn.

          ${EXPIRING_DETAILS}

          App: $(RESULT="$RESULT" node -e "const r=JSON.parse(process.env.RESULT); console.log(r.application?.displayName || r.application?.appId || 'onbekend')")
          Gecontroleerd op: $(RESULT="$RESULT" node -e "console.log(JSON.parse(process.env.RESULT).checkedAt)")
          Workflow-run: ${RUN_URL}

          Vernieuw het secret in Azure en werk AZURE_CLIENT_SECRET bij in de GitHub Actions-secrets en de productieomgeving.
          EOF
          )

          MAIL_SENT=0
          if [ -n "${AZURE_TENANT_ID:-}" ] && [ -n "${AZURE_CLIENT_ID:-}" ] && \
             [ -n "${AZURE_CLIENT_SECRET:-}" ] && [ -n "${RENE_EMAIL:-}" ]; then
            HTTP_TOKEN_CODE=$(curl -sS --max-time 20 -o /tmp/azure-mail-token.json -w "%{http_code}" \
              -X POST "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
              -d "client_id=${AZURE_CLIENT_ID}" \
              -d "client_secret=${AZURE_CLIENT_SECRET}" \
              -d "scope=https://graph.microsoft.com/.default" \
              -d "grant_type=client_credentials" || echo "000")
            TOKEN=$(node -e "try{const d=require('fs').readFileSync('/tmp/azure-mail-token.json','utf8');console.log(JSON.parse(d).access_token||'')}catch{console.log('')}")
            if [ -n "$TOKEN" ]; then
              PAYLOAD=$(MAIL_BODY="$BODY" MAIL_FROM="$MAIL_FROM" RENE_EMAIL="$RENE_EMAIL" node -e \
                "console.log(JSON.stringify({message:{subject:'FPS Connect: Azure client-secret verloopt binnenkort',body:{contentType:'Text',content:process.env.MAIL_BODY},toRecipients:[{emailAddress:{address:process.env.RENE_EMAIL}}],from:{emailAddress:{address:process.env.MAIL_FROM,name:'FPS Connect'}}},saveToSentItems:false}))")
              HTTP_MAIL_CODE=$(curl -sS --max-time 20 -o /tmp/azure-mail-response.json -w "%{http_code}" \
                -X POST "https://graph.microsoft.com/v1.0/users/${MAIL_MAILBOX}/sendMail" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" || echo "000")
              if [ "$HTTP_MAIL_CODE" -ge 200 ] && [ "$HTTP_MAIL_CODE" -lt 300 ]; then
                MAIL_SENT=1
                echo "::notice title=Azure client-secretcontrole::Waarschuwing per Graph-mail naar René verzonden."
              else
                echo "::warning title=Azure client-secretcontrole::Graph-mail mislukte (HTTP ${HTTP_MAIL_CODE}); GitHub-issue wordt gebruikt."
              fi
            else
              echo "::warning title=Azure client-secretcontrole::Graph-mailtoken mislukte (HTTP ${HTTP_TOKEN_CODE}); GitHub-issue wordt gebruikt."
            fi
          else
            echo "::warning title=Azure client-secretcontrole::Mailconfig ontbreekt; GitHub-issue wordt gebruikt."
          fi

          if [ "$MAIL_SENT" -ne 1 ]; then
            maak_issue "$SUBJECT" "$BODY" || true
          fi
          echo "::warning title=${SUBJECT}::${MESSAGE}"