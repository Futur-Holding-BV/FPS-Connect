version: "3.9"

# FPS Connect — productie Docker Compose
#
# Gebruik:
#   docker-compose -f docker-compose.production.yml up -d
#
# Vereiste .env-bestanden: zie docs/deployment.md

services:
  api:
    image: ${REGISTRY:-ghcr.io/fps-brandpreventie}/fps-connect-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.api
    environment:
      NODE_ENV: production
      PORT: "8080"
    networks:
      - internal
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  web:
    image: ${REGISTRY:-ghcr.io/fps-brandpreventie}/fps-connect-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # TLS-certificaten (bijv. via Certbot/Let's Encrypt)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fps} -d ${POSTGRES_DB:-fps_connect}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
