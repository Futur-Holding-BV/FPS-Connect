version: "3.9"

# ═════════════════════════════════════════════════════════════
#  ⚠️  NIET IN GEBRUIK — DIT IS NIET HET LEIDENDE DEPLOYMODEL  ⚠️
#
#  Dit bestand beschrijft het OUDE registry-model (pre-built images
#  vanuit GitHub ghcr.io). Dat model wordt NIET gebruikt: er is geen
#  workflow, script of CI die deze images bouwt/pusht of dit bestand
#  draait, en het default REGISTRY-pad hieronder is bovendien onjuist.
#
#  Het leidende productie-deploymodel is:
#      deploy/docker-compose.production.yml   (lokale-build-model)
#  Dat is wat de VPS draait en wat .github/workflows/deploy.yml gebruikt.
#
#  Gebruik dit bestand dus niet om te deployen. Het blijft alleen als
#  historische referentie voor het registry-model staan.
# ═════════════════════════════════════════════════════════════
#
# ─────────────────────────────────────────────────────────────
#  FPS Connect — (LEGACY) CI/CD productie Docker Compose
#
#  Gebruik: pre-built images vanuit container registry (GitHub ghcr.io)
#
#  Starten:
#    cp .env.docker.example .env.docker
#    nano .env.docker
#    docker compose -f docker-compose.production.yml --env-file .env.docker up -d
#
#  Voor disaster recovery zonder registry (bouw lokaal):
#    Gebruik docker-compose.yml in plaats van dit bestand.
#
#  Vereiste variabelen: zie .env.docker.example
# ─────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fps_connect
      POSTGRES_USER: fps
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fps -d fps_connect"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── MinIO (object storage) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── MinIO bucket aanmaken (eenmalig) ─────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal
    entrypoint: >
      sh -c "
        mc alias set fps http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing fps/fps-connect-bestanden &&
        mc policy set private fps/fps-connect-bestanden &&
        echo 'MinIO bucket gereed'
      "
    restart: "no"

  # ── API Server (pre-built image) ──────────────────────────────
  api:
    image: ${REGISTRY:-ghcr.io/fps-brandpreventie}/fps-connect-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgresql://fps:${DB_PASSWORD}@db:5432/fps_connect
      SESSION_SECRET: ${SESSION_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: eu-west-1
      S3_BUCKET: fps-connect-bestanden
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID_NEW: ${AZURE_CLIENT_ID_NEW}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      MAIL_MAILBOX: ${MAIL_MAILBOX}
      MAIL_FROM: ${MAIL_FROM}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Frontend (pre-built image → Nginx) ───────────────────────
  web:
    image: ${REGISTRY:-ghcr.io/fps-brandpreventie}/fps-connect-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Caddy (reverse proxy + automatisch TLS) ──────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on:
      - api
      - web
    networks:
      - internal
      - external
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  caddy_logs:
    driver: local
