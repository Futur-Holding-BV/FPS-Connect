server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Geen cache voor HTML-bestanden (zodat nieuwe deploys direct zichtbaar zijn)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # Lange cache voor assets met content-hash in bestandsnaam
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API-verzoeken doorzetten naar de api-server
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts voor langere API-operaties (bijv. AI, PDF-generatie)
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # SPA-fallback: alle andere routes naar index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Verberg nginx-versie in foutpagina's
    server_tokens off;

    # Basisbeveiliging
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
