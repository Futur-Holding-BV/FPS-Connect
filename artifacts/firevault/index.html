<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>FPS Connect</title>
    <meta name="description" content="FPS Connect — beheersomgeving voor brandpreventieve gebouwvoorzieningen." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="FPS Connect" />
    <meta property="og:description" content="FPS Connect — beheersomgeving voor brandpreventieve gebouwvoorzieningen." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FPS Connect" />
    <meta name="twitter:description" content="FPS Connect — beheersomgeving voor brandpreventieve gebouwvoorzieningen." />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F23B0D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FPS Connect" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/pwa-192.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      (function () {
        if ('%MODE%' === 'production') {
          var h = window.location.hostname;
          if (h !== 'localhost' && h !== '127.0.0.1' && h !== 'connect.fps-one.nl') {
            window.location.replace(
              'https://connect.fps-one.nl' +
                window.location.pathname +
                window.location.search
            );
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
