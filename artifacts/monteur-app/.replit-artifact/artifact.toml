kind = "mobile"
previewPath = "/monteur-app/"
title = "FPS Monteur"
version = "1.0.0"
id = "artifacts/monteur-app"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/monteur-app/" ]
localPort = 21646

[services.development]
run = "pnpm --filter @workspace/monteur-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/monteur-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/monteur-app", "run", "serve" ]

[services.env]
PORT = "21646"
BASE_PATH = "/monteur-app/"
