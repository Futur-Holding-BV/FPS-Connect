version: "3.9"

# ─────────────────────────────────────────────────────────────
#  FPS Connect — Selfhost Docker Compose
#
#  Bouwt alle containers lokaal vanuit de broncode.
#  Gebruik voor: disaster recovery, eigen server, eigen datacenter.
#
#  Vereiste omgevingsvariabelen: zie .env.docker.example
#
#  Starten:
#    cp .env.docker.example .env.docker
#    nano .env.docker                   # vul waarden in
#    docker compose --env-file .env.docker up -d --build
#
#  Schema initialiseren (eenmalig na eerste start):
#    docker compose exec api node --input-type=module \
#      --eval "import('./dist/index.mjs').then(()=>process.exit(0))"
#    docker compose exec -it api sh -c "pnpm db push" 2>/dev/null || true
#
#  Logs bekijken:
#    docker compose logs -f api
#    docker compose logs -f caddy
# ─────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fps_connect
      POSTGRES_USER: fps
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fps -d fps_connect"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── MinIO (object storage) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal
    ports:
      - "127.0.0.1:9001:9001"  # MinIO beheerinterface (alleen localhost)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── MinIO bucket aanmaken (eenmalig) ─────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal
    entrypoint: >
      sh -c "
        mc alias set fps http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing fps/fps-connect-bestanden &&
        mc policy set private fps/fps-connect-bestanden &&
        echo 'MinIO bucket gereed'
      "
    restart: "no"

  # ── API Server ───────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgresql://fps:${DB_PASSWORD}@db:5432/fps_connect
      SESSION_SECRET: ${SESSION_SECRET}
      # Object storage
      S3_ENDPOINT: http://minio:9000
      S3_REGION: eu-west-1
      S3_BUCKET: fps-connect-bestanden
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      # Microsoft Graph / e-mail
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID_NEW: ${AZURE_CLIENT_ID_NEW}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      MAIL_MAILBOX: ${MAIL_MAILBOX}
      MAIL_FROM: ${MAIL_FROM}
      # AI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Google Maps
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Frontend (React + Vite → Nginx) ──────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_FEATURE_PLANNING: ${VITE_FEATURE_PLANNING:-true}
        VITE_FEATURE_CALCULATIE: ${VITE_FEATURE_CALCULATIE:-false}
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Caddy (reverse proxy + automatisch TLS) ──────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on:
      - api
      - web
    networks:
      - internal
      - external
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  caddy_logs:
    driver: local
