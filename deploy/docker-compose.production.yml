version: "3.9"

# FPS Connect — Productie stack
#
# Architectuur (vereenvoudigd, geen dubbele proxy-laag):
#
#   Internet
#     │  HTTPS 443 / HTTP 80
#     ▼
#   caddy      — HTTPS (Let's Encrypt), statische frontend, /api/* proxy
#     │
#     ├── /api/*  →  api:8080
#     └── /*      →  /srv/public (ingebakken Vite-build)
#
#   api        — Express 5, Node 24, poort 8080 (intern)
#     │
#     └──  db:5432
#
#   db         — PostgreSQL 16 (intern, niet publiek)
#
#   minio      — S3-compatibele objectopslag (intern; presigned uploads lopen
#                via caddy: /fps-production/* → minio:9000)
#   minio-init — maakt de bucket eenmalig aan (restart: no)
#   migrate    — Drizzle push (eenmalig bij deployment, restart: no)
#   backup     — pg_dump + gzip (profiel "backup", handmatig of via cron)

services:

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: fps_production
      POSTGRES_USER: fps_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fps_app -d fps_production"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fps_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set fps http://minio:9000 $${MINIO_ROOT_USER:-fps_minio} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing fps/$${S3_BUCKET:-fps-production} &&
      echo 'MinIO bucket gereed'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fps_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-fps-production}

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        GIT_COMMIT: ${GIT_COMMIT:-onbekend}
        BUILD_TIJD: ${BUILD_TIJD:-}
        DEPLOY_NUMMER: ${DEPLOY_NUMMER:-}
    restart: always
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://localhost:8080/api/healthz', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
      args:
        GIT_COMMIT: ${GIT_COMMIT:-onbekend}
        BUILD_TIJD: ${BUILD_TIJD:-}
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: postgres:16-alpine
    restart: "no"
    profiles: ["backup"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db-backups:/backups
    command: >
      sh -c "pg_dump -h db -U fps_app fps_production | gzip > /backups/fps_$(date +%Y%m%d_%H%M%S).sql.gz && echo 'Backup klaar'"

  # Spiegelt de volledige objectopslag (geüploade bestanden) naar ./minio-backups.
  # Draaien naast de Postgres-backup: docker compose ... run --rm backup-minio
  backup-minio:
    image: minio/mc:latest
    restart: "no"
    profiles: ["backup"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fps_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-fps-production}
    volumes:
      - ./minio-backups:/backups
    entrypoint: >
      /bin/sh -c "
      mc alias set fps http://minio:9000 $${MINIO_ROOT_USER:-fps_minio} $${MINIO_ROOT_PASSWORD} &&
      mc mirror --overwrite fps/$${S3_BUCKET:-fps-production} /backups/$${S3_BUCKET:-fps-production} &&
      echo 'MinIO-backup klaar'
      "

volumes:
  db_data:
  minio_data:
  caddy_data:
  caddy_config:
